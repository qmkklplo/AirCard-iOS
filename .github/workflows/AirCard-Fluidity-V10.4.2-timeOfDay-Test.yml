name: AirCard Fluidity V10.4.2 timeOfDay Single Variable Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/AirCard-Fluidity-V10.4.1-iOS18-HomeSnapshotFix.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      IPA_NAME: AirCard-iOS-Fluidity-V10.4.2-timeOfDay-Test-ZH.ipa
      BASE_WORKFLOW: .github/workflows/AirCard-Fluidity-V10.4-iOS18-Dynamic-HomeBlur.yml
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Reuse V10.4 base only
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RB'
          require 'yaml'
          d = YAML.load_file(ENV.fetch('BASE_WORKFLOW'))
          steps = d.fetch('jobs').fetch('build').fetch('steps')
          step = steps.find { |x| x['name'] == 'Integrate V10 features' } or abort('Missing base step: Integrate V10 features')
          File.write('/tmp/base-v10.sh', step.fetch('run'))
          RB
          bash /tmp/base-v10.sh

      - name: Integrate 459C timeOfDay single-variable restore
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('ios-app/TendiesEngine.swift')
          s = p.read_text()

          helper = r'''
              // MARK: - 459C timeOfDay Single Variable Test
              private func restore459CTimeOfDay(
                  in mercuryContainerRoot: URL,
                  log: @escaping (String) -> Void
              ) {
                  let fm = FileManager.default
                  let targetUUID = "459C311E-3615-4485-A24A-33A10CB3A3ED"
                  guard let e = fm.enumerator(
                      at: mercuryContainerRoot,
                      includingPropertiesForKeys: [.isRegularFileKey],
                      options: [.skipsHiddenFiles]
                  ) else {
                      log("  ⚠️ timeOfDay restore: MercuryPoster payload could not be enumerated")
                      return
                  }

                  var patched = 0
                  while let url = e.nextObject() as? URL {
                      let path = url.path
                      guard path.contains("/" + targetUUID + "/"),
                            url.lastPathComponent == "com.apple.posterkit.provider.contents.userInfo",
                            let data = try? Data(contentsOf: url),
                            var plist = (try? PropertyListSerialization.propertyList(
                                from: data, options: .mutableContainers, format: nil
                            )) as? [String: Any] else { continue }

                      plist["appearanceMode"] = "Automatic"
                      plist["lookIdentifier"] = "timeOfDay"
                      do {
                          let out = try PropertyListSerialization.data(
                              fromPropertyList: plist, format: .binary, options: 0
                          )
                          try out.write(to: url, options: .atomic)
                          patched += 1
                          log("  🕒 459C userInfo restored: Automatic / timeOfDay")
                      } catch {
                          log("  ⚠️ timeOfDay restore failed: \(error.localizedDescription)")
                      }
                  }
                  log("  🧪 Single-variable result: patchedUserInfo=\(patched); snapshots/supplements untouched")
              }

          '''

          marker = '    // MARK: - Plist Identifier Handling\n'
          if marker not in s:
              marker = '    // MARK: - Folder Injector Helper (Single Atomic Move via AirTraffic)\n'
          if marker not in s:
              raise SystemExit('TendiesEngine helper insertion marker not found')
          if 'restore459CTimeOfDay' not in s:
              s = s.replace(marker, helper + marker, 1)

          anchor = '                log("  📦 V8 Container Tendie detected — preserving original paths and identifiers")\n'
          call = '''                let mercuryRootForTimeOfDayTest = containerStage.appendingPathComponent(
                    "Library/Application Support/PRBPosterExtensionDataStore/61/Extensions/com.apple.MercuryPoster"
                )
                if FileManager.default.fileExists(atPath: mercuryRootForTimeOfDayTest.path) {
                    log("  🧪 Applying 459C timeOfDay single-variable restore")
                    restore459CTimeOfDay(in: mercuryRootForTimeOfDayTest, log: log)
                }

          '''
          if 'Applying 459C timeOfDay single-variable restore' not in s:
              if anchor not in s:
                  raise SystemExit('V8 passthrough anchor not found')
              s = s.replace(anchor, call + anchor, 1)

          p.write_text(s)
          body = p.read_text()
          required = ['restore459CTimeOfDay','459C311E-3615-4485-A24A-33A10CB3A3ED','plist["lookIdentifier"] = "timeOfDay"']
          missing = [x for x in required if x not in body]
          if missing: raise SystemExit('Missing single-variable integration: ' + ', '.join(missing))
          forbidden = ['prepareIOS18CelosiaHomeSnapshotRegeneration','fluidity.dynamic','applyIOS18FluidityDynamicMode']
          bad = [x for x in forbidden if x in body]
          if bad: raise SystemExit('Forbidden experimental code present: ' + ', '.join(bad))
          print('459C timeOfDay single-variable restore integrated')
          PY

      - name: Detect project and build IPA
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$(find . -name '*.xcodeproj' -print -quit)"
          test -n "$PROJ"
          DIR="$(dirname "$PROJ")"; NAME="$(basename "$PROJ")"
          SCHEME="$(cd "$DIR" && xcodebuild -project "$NAME" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"
          test -n "$SCHEME"
          cd "$DIR"
          xcodebuild -project "$NAME" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AirCardV1042" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=10.4.2 CURRENT_PROJECT_VERSION=1042 COMPILER_INDEX_STORE_ENABLE=NO build

          APP="$(find "$RUNNER_TEMP/AirCardV1042/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 10.4.2' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1042' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName AirCard-iOS' "$APP/Info.plist" 2>/dev/null || true

          cd "$GITHUB_WORKSPACE"
          rm -rf Payload release && mkdir -p Payload release
          cp -R "$APP" Payload/
          zip -0qry "release/$IPA_NAME" Payload
          unzip -Z1 "release/$IPA_NAME" | grep -q '^Payload/.*\.app/'
          shasum -a 256 "release/$IPA_NAME" | tee release/AirCard-V10.4.2-timeOfDay-Test-SHA256.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-Fluidity-V10.4.2-timeOfDay-Test-IPA
          path: release/*
          retention-days: 14

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v10.4.2-timeofday-test"
          TITLE="AirCard Fluidity V10.4.2 · timeOfDay Single Variable Test"
          NOTES="单变量测试：仅将 459C311E… 的 appearanceMode 恢复为 Automatic、lookIdentifier 恢复为 timeOfDay；不执行 Home Snapshot invalidation，不写 Blur supplement，不改 UUID。用于观察「组合」缩略图和 Home 主屏幕预览是否变化。"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG" release/* --title "$TITLE" --notes "$NOTES" --repo "$GH_REPO"
          fi
