name: AirCard Fluidity V10.4.4 Active459C timeOfDay Test
# trigger: fixed execution-path build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/AirCard-Fluidity-V10.4.4-Active459C-timeOfDay.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      IPA_NAME: AirCard-iOS-Fluidity-V10.4.4-Active459C-timeOfDay-ZH.ipa
      BASE_WORKFLOW: .github/workflows/AirCard-Fluidity-V10.4-iOS18-Dynamic-HomeBlur.yml

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Reuse V10.4 base only
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RB'
          require 'yaml'
          d = YAML.load_file(ENV.fetch('BASE_WORKFLOW'))
          steps = d.fetch('jobs').fetch('build').fetch('steps')
          step = steps.find { |x| x['name'] == 'Integrate V10 features' } or abort('Missing V10 base step')
          File.write('/tmp/v10-base.sh', step.fetch('run'))
          RB
          bash /tmp/v10-base.sh

      - name: Integrate exact active 459C timeOfDay writer
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          engine = Path("ios-app/TendiesEngine.swift")
          s = engine.read_text()
          method = r'''
              // MARK: - V10.4.4 Active 459C timeOfDay A/B
              public func restoreActive459CTimeOfDay(
                  containerPath: String,
                  pairingPath: String,
                  log: @escaping (String) -> Void
              ) async throws {
                  let configUUID = "459C311E-3615-4485-A24A-33A10CB3A3ED"
                  let fileName = "com.apple.posterkit.provider.contents.userInfo"

                  var normalizedContainer = containerPath.trimmingCharacters(in: .whitespacesAndNewlines)
                  if normalizedContainer.hasSuffix("/") { normalizedContainer = String(normalizedContainer.dropLast()) }
                  guard !normalizedContainer.isEmpty else {
                      throw NSError(domain: "TendiesEngine", code: 1044,
                                    userInfo: [NSLocalizedDescriptionKey: "PosterBoard container path is required."])
                  }

                  let plist: [String: Any] = [
                      "appearanceMode": "Automatic",
                      "lookIdentifier": "timeOfDay"
                  ]
                  let data = try PropertyListSerialization.data(
                      fromPropertyList: plist, format: .binary, options: 0
                  )

                  let stageDir = FileManager.default.temporaryDirectory
                      .appendingPathComponent("active_459c_timeofday_\(UUID().uuidString)")
                  try FileManager.default.createDirectory(at: stageDir, withIntermediateDirectories: true)
                  defer { try? FileManager.default.removeItem(at: stageDir) }

                  let fileURL = stageDir.appendingPathComponent(fileName)
                  try data.write(to: fileURL, options: .atomic)

                  let targetDir = "\(normalizedContainer)/Library/Application Support/PRBPosterExtensionDataStore/61/Extensions/com.apple.MercuryPoster/configurations/\(configUUID)/versions/18/contents"
                  log("🧪 V10.4.4 exact target: 459C…/versions/18/contents/userInfo")
                  log("🕒 Writing appearanceMode=Automatic, lookIdentifier=timeOfDay")
                  try await writeDirectoryTree(
                      sourceBaseDir: stageDir,
                      targetBaseDir: targetDir,
                      pairingPath: pairingPath,
                      log: log
                  )
                  log("✅ Active 459C/version18 userInfo write completed")
              }

          '''
          marker = "    // MARK: - Send Respring Signal via Tunnel\n"
          if marker not in s:
              raise SystemExit("Engine insertion marker missing")
          if "restoreActive459CTimeOfDay" not in s:
              s = s.replace(marker, method + marker, 1)
          engine.write_text(s)

          vm = Path("ios-app/AppViewModel.swift")
          v = vm.read_text()
          # Patch the wallpaper flash function specifically.
          fn = v.index("    func flashSelectedTendies() async {")
          if fn < 0: raise SystemExit("wallpaper flash function missing")
          tail = v.index("\n    func respringDevice()", fn)
          if tail < 0: raise SystemExit("wallpaper flash end missing")
          block = v[fn:tail]
          anchor = '            tendiesFlashPhase = .done(ok: true)\n'
          call = '''            tendiesFlashLog.append("V10.4.4 active 459C/version18 exact write")
                      try await TendiesEngine.shared.restoreActive459CTimeOfDay(
                          containerPath: container,
                          pairingPath: pairingPath,
                          log: { [weak self] line in
                              DispatchQueue.main.async { self?.tendiesFlashLog.append(line) }
                          }
                      )
          '''
          if anchor not in block: raise SystemExit("wallpaper success anchor missing")
          block = block.replace(anchor, call + anchor, 1)
          v = v[:fn] + block + v[tail:]
          vm.write_text(v)

          # Build-time execution-path verification.
          vv = vm.read_text()
          fn2 = vv.index("    func flashSelectedTendies() async {")
          tail2 = vv.index("\n    func respringDevice()", fn2)
          wb = vv[fn2:tail2]
          if "restoreActive459CTimeOfDay(" not in wb:
              raise SystemExit("VERIFY FAILED: active writer is outside wallpaper path")
          if wb.index("restoreActive459CTimeOfDay(") > wb.index("tendiesFlashPhase = .done(ok: true)"):
              raise SystemExit("VERIFY FAILED: active writer executes after success state")
          print("Verified active writer in wallpaper flash path")
          body = engine.read_text() + vm.read_text()
          required = [
              "restoreActive459CTimeOfDay",
              "459C311E-3615-4485-A24A-33A10CB3A3ED",
              "/versions/18/contents",
              '"lookIdentifier": "timeOfDay"',
              '"appearanceMode": "Automatic"',
          ]
          missing = [x for x in required if x not in body]
          if missing: raise SystemExit("Missing exact-writer integration: " + ", ".join(missing))
          forbidden = [
              "prepareIOS18CelosiaHomeSnapshotRegeneration",
              "setFluidityHomeScreenBlur",
              "applyIOS18FluidityDynamicMode",
              "fluidity.dynamic",
          ]
          bad = [x for x in forbidden if x in body]
          if bad: raise SystemExit("Experimental writer unexpectedly present: " + ", ".join(bad))
          print("V10.4.4 exact active-config writer integrated")
          PY

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$(find . -name '*.xcodeproj' -print -quit)"
          test -n "$PROJ"
          DIR="$(dirname "$PROJ")"; NAME="$(basename "$PROJ")"
          SCHEME="$(cd "$DIR" && xcodebuild -project "$NAME" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"
          test -n "$SCHEME"
          cd "$DIR"
          xcodebuild -project "$NAME" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AirCardV1044" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=10.4.4 CURRENT_PROJECT_VERSION=1044 COMPILER_INDEX_STORE_ENABLE=NO build
          APP="$(find "$RUNNER_TEMP/AirCardV1044/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 10.4.4' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1044' "$APP/Info.plist"
          cd "$GITHUB_WORKSPACE"
          rm -rf Payload release && mkdir -p Payload release
          cp -R "$APP" Payload/
          zip -0qry "release/$IPA_NAME" Payload
          shasum -a 256 "release/$IPA_NAME" | tee release/AirCard-V10.4.4-Active459C-timeOfDay-SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-Fluidity-V10.4.4-Active459C-timeOfDay-IPA
          path: release/*
          retention-days: 14

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v10.4.4-active459c-timeofday-fixed"
          TITLE="AirCard Fluidity V10.4.4 · Active 459C timeOfDay A/B"
          NOTES="单变量 A/B：刷入完成后精确覆盖 active 459C/version18/contents/userInfo 为 appearanceMode=Automatic + lookIdentifier=timeOfDay。不会执行 Home Snapshot invalidation，不写 Blur supplement，不改 UUID。"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG" release/* --title "$TITLE" --notes "$NOTES" --repo "$GH_REPO"
          fi
