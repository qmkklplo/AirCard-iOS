name: AirCard Fluidity V10.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      IPA_NAME: AirCard-iOS-Fluidity-V10.2.ipa

    steps:
      - name: Checkout AirCard v1.3.2
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.2 https://github.com/Mak5er/AirCard-iOS.git AirCard-iOS
          cd AirCard-iOS
          test "$(git describe --tags --exact-match)" = "v1.3.2"
          echo "Source commit: $(git rev-parse HEAD)"

      - name: Apply V10.2 patches
        working-directory: AirCard-iOS
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          engine = Path("ios-app/TendiesEngine.swift")
          if not engine.exists():
              raise SystemExit("TendiesEngine.swift not found")
          e = engine.read_text()

          marker = '            log("  🖼 Locating wallpaper descriptors…")\n'
          lines = [
              '            // Fluidity V10.2: safe V8-style App Container passthrough.',
              '            // Preserve original PosterBoard-relative paths, UUIDs and semantic identifiers.',
              '            let containerStage = tempStageDir.appendingPathComponent("container")',
              '            if item.isContainer && FileManager.default.fileExists(atPath: containerStage.path) {',
              '                if item.unsafeContainer {',
              '                    throw NSError(',
              '                        domain: "TendiesEngine",',
              '                        code: 27,',
              '                        userInfo: [NSLocalizedDescriptionKey: "Unsafe container Tendie refused: PosterBoard SQLite database is present."]',
              '                    )',
              '                }',
              '',
              '                log("  📦 V10.2 Container Tendie detected — preserving original paths and identifiers")',
              '                try await writeDirectoryTree(',
              '                    sourceBaseDir: containerStage,',
              '                    targetBaseDir: normalizedContainer,',
              '                    pairingPath: pairingPath,',
              '                    log: log',
              '                )',
              '                log("  ✅ V10.2 container tree injected without descriptor UUID/ID randomization")',
              '                progress(Double(itemIndex + 1) / (totalItems + 1))',
              '                continue',
              '            }',
              '',
          ]
          patch = "\n".join(lines) + "\n"

          if "V10.2 Container Tendie detected" in e:
              raise SystemExit("V10.2 passthrough already present")
          if marker not in e:
              raise SystemExit("Verified v1.3.2 descriptor anchor missing; aborting safely")
          e = e.replace(marker, patch + marker, 1)
          engine.write_text(e)

          eb = engine.read_text()
          required = [
              "V10.2 Container Tendie detected",
              "sourceBaseDir: containerStage",
              "targetBaseDir: normalizedContainer",
              "Unsafe container Tendie refused",
              "PersistedPosterContainerBundleIdentifiers",
              "com.apple.MercuryPoster",
              "com.apple.Posters.MercuryPosterApp",
          ]
          missing = [x for x in required if x not in eb]
          if missing:
              raise SystemExit("Engine verification failed: " + ", ".join(missing))
          if eb.find("V10.2 Container Tendie detected") >= eb.find('log("  🖼 Locating wallpaper descriptors…")'):
              raise SystemExit("Passthrough must precede descriptor discovery")
          print("V10.2 passthrough + official v1.3.2 Mercury refresh verified")

          files = list(Path(".").rglob("*.swift"))
          vm = next((p for p in files if "flashTendies" in p.read_text(errors="ignore") and "triggerNeoSpring" in p.read_text(errors="ignore")), None)
          if vm is None:
              raise SystemExit("Could not locate flashTendies view-model")
          s = vm.read_text()

          anchor = '@Published var isNeoSpringing: Bool = false'
          if "autoNeoSpringAfterFlash" not in s:
              if anchor not in s:
                  raise SystemExit("isNeoSpringing anchor missing")
              setting_lines = [
                  '',
                  '    @Published var autoNeoSpringAfterFlash: Bool = UserDefaults.standard.object(forKey: "aircard.v10.auto_neospring") as? Bool ?? false {',
                  '        didSet {',
                  '            UserDefaults.standard.set(autoNeoSpringAfterFlash, forKey: "aircard.v10.auto_neospring")',
                  '        }',
                  '    }',
              ]
              s = s.replace(anchor, anchor + "\n".join(setting_lines), 1)

          if "V10 Auto NeoSpring is OFF" not in s:
              pattern = re.compile(
                  r'(?P<indent>[ \t]*)tendiesFlashLog\.append\("🎉 Wallpapers applied successfully!"\)\s*'
                  r'tendiesFlashLog\.append\("⚡ Triggering NeoSpring respring\.\.\."\)\s*'
                  r'DispatchQueue\.main\.asyncAfter\(deadline: \.now\(\) \+ 0\.6\) \{ \[weak self\] in\s*'
                  r'self\?\.isNeoSpringing = true\s*'
                  r'RespringHelper\.triggerNeoSpring\(\)\s*\}',
                  re.M
              )
              m = pattern.search(s)
              if not m:
                  raise SystemExit("Official v1.3.2 automatic NeoSpring block not found")
              i = m.group("indent")
              replacement = (
                  i + 'tendiesFlashLog.append("🎉 Wallpapers applied successfully!")\n'
                  + i + 'if autoNeoSpringAfterFlash {\n'
                  + i + '    tendiesFlashLog.append("⚡ V10 Auto NeoSpring is ON — triggering respring...")\n'
                  + i + '    DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) { [weak self] in\n'
                  + i + '        self?.isNeoSpringing = true\n'
                  + i + '        RespringHelper.triggerNeoSpring()\n'
                  + i + '    }\n'
                  + i + '} else {\n'
                  + i + '    tendiesFlashLog.append("🧪 V10 Auto NeoSpring is OFF — complete flash log preserved. Use manual Respring when ready.")\n'
                  + i + '}'
              )
              s = s[:m.start()] + replacement + s[m.end():]
          vm.write_text(s)

          view = next((p for p in files if 'Force PosterBoard Cache Refresh' in p.read_text(errors="ignore") and 'Respring (NeoSpring)' in p.read_text(errors="ignore")), None)
          if view is None:
              raise SystemExit("TendiesView not found")
          v = view.read_text()

          if 'Text("Auto NeoSpring After Flash")' not in v:
              section3 = "                // Section 3: Wallpapers Gallery"
              pos = v.find(section3)
              if pos < 0:
                  raise SystemExit("Wallpapers Gallery marker missing")
              auto_section = (
                  '                Section {\n'
                  '                    Toggle(isOn: $vm.autoNeoSpringAfterFlash) {\n'
                  '                        VStack(alignment: .leading, spacing: 2) {\n'
                  '                            Text("Auto NeoSpring After Flash")\n'
                  '                                .font(.subheadline.weight(.medium))\n'
                  '                            Text("OFF keeps AirCard open and preserves the complete flash log.")\n'
                  '                                .font(.caption2)\n'
                  '                                .foregroundColor(.secondary)\n'
                  '                        }\n'
                  '                    }\n'
                  '                }\n\n'
              )
              v = v[:pos] + auto_section + v[pos:]

          v = v.replace(
              'Text("Flashing will automatically trigger NeoSpring to respring the device and apply your new wallpapers.")',
              'Text("V10.2: Auto NeoSpring is OFF by default. Review the complete flash log, then use manual Respring when ready.")'
          )

          pc = v.find('Text("Force PosterBoard Cache Refresh")')
          pa = v.find('Text("Auto NeoSpring After Flash")')
          pg = v.find("// Section 3: Wallpapers Gallery")
          if not (0 <= pc < pa < pg):
              raise SystemExit("Settings layout verification failed")
          view.write_text(v)

          pbx = next(Path(".").rglob("project.pbxproj"), None)
          if pbx is None:
              raise SystemExit("project.pbxproj not found")
          x = pbx.read_text()
          x, a = re.subn(r'MARKETING_VERSION\s*=\s*[^;]+;', 'MARKETING_VERSION = 10.2;', x)
          x, b = re.subn(r'CURRENT_PROJECT_VERSION\s*=\s*[^;]+;', 'CURRENT_PROJECT_VERSION = 1020;', x)
          if not a or not b:
              raise SystemExit("Version fields not found")
          pbx.write_text(x)
          print("V10.2 integration complete")
          PY

          grep -q 'V10.2 Container Tendie detected' ios-app/TendiesEngine.swift
          grep -q 'PersistedPosterContainerBundleIdentifiers' ios-app/TendiesEngine.swift
          grep -q 'com.apple.Posters.MercuryPosterApp' ios-app/TendiesEngine.swift
          echo "V10.2 source assertions passed."

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        working-directory: AirCard-iOS
        run: |
          set -euo pipefail
          if [ -f project.yml ]; then xcodegen generate; fi

      - name: Detect project and scheme
        id: xcode
        working-directory: AirCard-iOS
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$(find . -name '*.xcodeproj' -print -quit)"
          test -n "$PROJ"
          DIR="$(dirname "$PROJ")"
          NAME="$(basename "$PROJ")"
          SCHEME="$(cd "$DIR" && xcodebuild -project "$NAME" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"
          test -n "$SCHEME"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "project=$NAME" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build V10.2
        working-directory: AirCard-iOS
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.xcode.outputs.dir }}"
          xcodebuild \
            -project "${{ steps.xcode.outputs.project }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AirCardV102" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=10.2 \
            CURRENT_PROJECT_VERSION=1020 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/AirCardV102/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          echo "Version: $VERSION ($BUILD)"
          [ "$VERSION" = "10.2" ]
          [ "$BUILD" = "1020" ]

          rm -rf Payload release
          mkdir -p Payload release
          cp -R "$APP" Payload/
          zip -0qry "release/$IPA_NAME" Payload
          unzip -Z1 "release/$IPA_NAME" | grep -q '^Payload/.*\.app/'
          shasum -a 256 "release/$IPA_NAME" > release/AirCard-V10.2-SHA256.txt

      - name: Publish V10.2 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v10.2-fluidity"
          TITLE="AirCard Fluidity V10.2"
          NOTES="Based on official AirCard v1.3.2. Adds safe V8-style App Container passthrough while retaining official Mercury/PosterBoard refresh logic. Auto NeoSpring After Flash is OFF by default."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "release/$IPA_NAME" \
              release/AirCard-V10.2-SHA256.txt \
              --clobber
          else
            gh release create "$TAG" \
              "release/$IPA_NAME" \
              release/AirCard-V10.2-SHA256.txt \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
