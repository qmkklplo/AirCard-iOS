          echo "V7 source files installed."

      - name: Verify V7 Persistent Diagnostic
        run: |
          grep -n "V7 Diagnostic" ios-app/TendiesEngine.swift
          grep -n "Last-Flash-Diagnostic.log" ios-app/AppViewModel.swift
          grep -n "Last Flash Diagnostic Log" ios-app/TendiesView.swift
          grep -n "com.apple.MercuryPoster" ios-app/TendiesEngine.swift

      - name: Build IPA
        run: |
          chmod +x build-ipa.sh
          ./build-ipa.sh
          test -f build/AirCard-iOS.ipa
          cp build/AirCard-iOS.ipa build/AirCard-V7-Persistent-Diagnostic.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-V7-Persistent-Diagnostic
          path: build/AirCard-V7-Persistent-Diagnostic.ipa

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mercury-v7-persistent --cleanup-tag -y 2>/dev/null || true
          gh release create mercury-v7-persistent build/AirCard-V7-Persistent-Diagnostic.ipa --target "${{ github.sha }}" --title "AirCard Mercury V7 Persistent Diagnostic" --notes "V7 diagnostic build with persistent flash log that survives automatic NeoSpring/logout."
