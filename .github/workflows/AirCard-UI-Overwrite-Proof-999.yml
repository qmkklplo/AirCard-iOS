name: AirCard UI Overwrite Proof 999

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      IPA_NAME: AirCard-UI-PROOF-build999.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch version and inject unmistakable UI marker
        shell: bash
        run: |
          set -euo pipefail

          PBX="$(find . -name project.pbxproj -print -quit)"
          test -n "$PBX" || { echo "::error::project.pbxproj not found"; exit 1; }

          python3 - "$PBX" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s, a = re.subn(r'MARKETING_VERSION\s*=\s*[^;]+;', 'MARKETING_VERSION = 9.9;', s)
          s, b = re.subn(r'CURRENT_PROJECT_VERSION\s*=\s*[^;]+;', 'CURRENT_PROJECT_VERSION = 999;', s)
          if not a or not b:
              raise SystemExit("Version/build settings not found")
          p.write_text(s)
          PY

          # Find the Swift file that renders the visible AirCard.iOS home card.
          TARGET="$(grep -RIl --include='*.swift' 'AirCard\.iOS' . | head -1 || true)"
          test -n "$TARGET" || { echo "::error::Could not find Swift UI containing AirCard.iOS"; exit 1; }

          echo "Injecting marker into: $TARGET"

          python3 - "$TARGET" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          marker = 'Text("OVERWRITE TEST BUILD 999")'
          if marker in s:
              print("Marker already present")
              raise SystemExit(0)

          # Insert a standalone visible Text immediately after the first visible
          # Text("AirCard.iOS") occurrence. It does not depend on version logic.
          needle = 'Text("AirCard.iOS")'
          idx = s.find(needle)
          if idx < 0:
              raise SystemExit('Exact Text("AirCard.iOS") not found in target Swift file')

          # Find the end of the line containing that Text.
          end = s.find("\n", idx)
          if end < 0:
              end = idx + len(needle)

          indent_start = s.rfind("\n", 0, idx) + 1
          indent = s[indent_start:idx]
          injection = (
              '\n' + indent + 'Text("OVERWRITE TEST BUILD 999")'
              '\n' + indent + '    .font(.caption.bold())'
              '\n' + indent + '    .foregroundStyle(.red)'
          )
          s = s[:end] + injection + s[end:]
          p.write_text(s)
          print("Injected:", marker)
          PY

          grep -RIn --include='*.swift' 'OVERWRITE TEST BUILD 999' .

      - name: Detect project and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$(find . -name '*.xcodeproj' -print -quit)"
          test -n "$PROJ" || exit 1
          DIR="$(dirname "$PROJ")"
          NAME="$(basename "$PROJ")"
          SCHEME="$(cd "$DIR" && xcodebuild -project "$NAME" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"
          test -n "$SCHEME" || exit 1
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "project=$NAME" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.xcode.outputs.dir }}"
          xcodebuild \
            -project "${{ steps.xcode.outputs.project }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AirCardBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=9.9 \
            CURRENT_PROJECT_VERSION=999 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify build and fast-package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/AirCardBuild/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP" || { echo "::error::Built .app missing"; exit 1; }

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          echo "Version: $VERSION / Build: $BUILD"
          [ "$VERSION" = "9.9" ] && [ "$BUILD" = "999" ]

          rm -rf Payload release
          mkdir -p Payload release
          cp -R "$APP" Payload/
          zip -0qry "release/$IPA_NAME" Payload
          unzip -Z1 "release/$IPA_NAME" | grep -q '^Payload/.*\.app/'
          shasum -a 256 "release/$IPA_NAME" > release/SHA256-UI-PROOF.txt
          ls -lh "release/$IPA_NAME"

      - name: Publish to latest Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest \
              "release/$IPA_NAME" \
              release/SHA256-UI-PROOF.txt \
              --clobber
          else
            gh release create latest \
              "release/$IPA_NAME" \
              release/SHA256-UI-PROOF.txt \
              --title "AirCard UI Overwrite Proof 999" \
              --prerelease
          fi
