name: AirCard Overwrite Proof 9.9

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force unmistakable overwrite markers
        shell: bash
        run: |
          set -euo pipefail

          PBX="$(find . -name project.pbxproj -print -quit)"
          test -n "$PBX" || { echo "::error::project.pbxproj not found"; exit 1; }

          python3 - "$PBX" <<'PY'
          import re, sys
          from pathlib import Path

          pbx = Path(sys.argv[1])
          s = pbx.read_text()
          s, n1 = re.subn(r'MARKETING_VERSION\s*=\s*[^;]+;',
                           'MARKETING_VERSION = 9.9;', s)
          s, n2 = re.subn(r'CURRENT_PROJECT_VERSION\s*=\s*[^;]+;',
                           'CURRENT_PROJECT_VERSION = 999;', s)
          if not n1 or not n2:
              raise SystemExit("Could not find version/build settings")
          pbx.write_text(s)
          print(f"Version entries changed: {n1}; build entries changed: {n2}")
          PY

          # Change the app's visible display name through build settings.
          python3 - "$PBX" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          if "INFOPLIST_KEY_CFBundleDisplayName" in s:
              s = re.sub(r'INFOPLIST_KEY_CFBundleDisplayName\s*=\s*[^;]+;',
                         'INFOPLIST_KEY_CFBundleDisplayName = "AirCard TEST 9.9";', s)
          else:
              # Add beside MARKETING_VERSION in each relevant build configuration.
              s = s.replace('MARKETING_VERSION = 9.9;',
                            'MARKETING_VERSION = 9.9;\n\t\t\t\tINFOPLIST_KEY_CFBundleDisplayName = "AirCard TEST 9.9";')
          p.write_text(s)
          PY

          # Replace the hard-coded visible v1.3 marker in Swift source.
          # This intentionally changes ONLY user-visible version markers.
          MATCHES="$(grep -RIl --include='*.swift' -E 'iOS 27[[:space:]]*[·•][[:space:]]*v1\.3|v1\.3' . || true)"
          echo "Swift files containing v1.3:"
          echo "$MATCHES"

          if [ -n "$MATCHES" ]; then
            while IFS= read -r f; do
              python3 - "$f" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace("iOS 27 · v1.3", "iOS 27 · v9.9-OVERWRITE-TEST")
          s = s.replace("iOS 27 • v1.3", "iOS 27 · v9.9-OVERWRITE-TEST")
          # Fallback for isolated visible version strings.
          s = s.replace('"v1.3"', '"v9.9-OVERWRITE-TEST"')
          p.write_text(s)
          PY
            done <<< "$MATCHES"
          fi

          echo "=== Remaining v1.3 references ==="
          grep -RIn --include='*.swift' 'v1\.3' . || true
          echo "=== New overwrite marker ==="
          grep -RIn --include='*.swift' 'OVERWRITE-TEST' . || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust core if present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f rust-core/Cargo.toml ]; then
            cd rust-core
            if [ -f build.sh ]; then
              chmod +x build.sh
              ./build.sh
            elif [ -f build_ios.sh ]; then
              chmod +x build_ios.sh
              ./build_ios.sh
            else
              cargo build --release --target aarch64-apple-ios
            fi
          fi

      - name: Detect Xcode project and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$(find . -name '*.xcodeproj' -print -quit)"
          test -n "$PROJ" || { echo "::error::No Xcode project found"; exit 1; }
          DIR="$(dirname "$PROJ")"
          NAME="$(basename "$PROJ")"
          SCHEME="$(cd "$DIR" && xcodebuild -project "$NAME" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"
          test -n "$SCHEME" || { echo "::error::No Xcode scheme found"; exit 1; }
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "project=$NAME" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned test app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/AirCardBuild"
          cd "${{ steps.xcode.outputs.dir }}"
          xcodebuild \
            -project "${{ steps.xcode.outputs.project }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AirCardBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=9.9 \
            CURRENT_PROJECT_VERSION=999 \
            INFOPLIST_KEY_CFBundleDisplayName="AirCard TEST 9.9" \
            build

      - name: Verify built app markers
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/AirCardBuild/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP" || { echo "::error::Built .app not found"; exit 1; }

          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          DISPLAY=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist" 2>/dev/null || true)

          echo "Bundle ID: $ID"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          echo "Display Name: $DISPLAY"

          [ "$VERSION" = "9.9" ] || { echo "::error::Expected 9.9"; exit 1; }
          [ "$BUILD" = "999" ] || { echo "::error::Expected 999"; exit 1; }
          [ "$DISPLAY" = "AirCard TEST 9.9" ] || { echo "::error::Display name marker missing"; exit 1; }

      - name: Package and validate IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/AirCardBuild/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          rm -rf Payload release
          mkdir -p Payload release
          ditto "$APP" "Payload/$(basename "$APP")"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload \
            "release/AirCard-OVERWRITE-PROOF-9.9-build999.ipa"

          IPA="release/AirCard-OVERWRITE-PROOF-9.9-build999.ipa"
          unzip -t "$IPA"
          unzip -l "$IPA" | grep -q 'Payload/.*\.app/' || exit 1
          shasum -a 256 "$IPA" | tee release/SHA256-OVERWRITE-PROOF.txt
          ls -lh "$IPA"

      - name: Remove same-name old assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset latest "AirCard-OVERWRITE-PROOF-9.9-build999.ipa" --yes 2>/dev/null || true
          gh release delete-asset latest "SHA256-OVERWRITE-PROOF.txt" --yes 2>/dev/null || true

      - name: Publish overwrite proof
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AirCard Overwrite Proof 9.9
          prerelease: true
          make_latest: true
          body: |
            Unmistakable overwrite-installation diagnostic build.
            Version: 9.9
            Build: 999
            Display name: AirCard TEST 9.9
            In-app marker: iOS 27 · v9.9-OVERWRITE-TEST
          files: |
            release/AirCard-OVERWRITE-PROOF-9.9-build999.ipa
            release/SHA256-OVERWRITE-PROOF.txt
          fail_on_unmatched_files: true
