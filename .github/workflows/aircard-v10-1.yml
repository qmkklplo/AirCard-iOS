name: AirCard Fluidity V10.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AirCard V10.1
    runs-on: macos-latest

    env:
      IPA_NAME: AirCard-iOS-Fluidity-V10.1.ipa

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Patch AirCard V10.1
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          swift_files = list(Path(".").rglob("*.swift"))

          if not swift_files:
              raise SystemExit("No Swift files found")

          # ============================================================
          # 1. Locate AppViewModel
          # ============================================================

          vm = next(
              (
                  p for p in swift_files
                  if "flashTendies" in p.read_text(errors="ignore")
                  and "triggerNeoSpring" in p.read_text(errors="ignore")
              ),
              None
          )

          if vm is None:
              raise SystemExit("Could not locate AppViewModel")

          s = vm.read_text()

          # ============================================================
          # 2. Add persistent Auto NeoSpring setting
          #    Default = OFF
          # ============================================================

          if "autoNeoSpringAfterFlash" not in s:

              anchor = "@Published var isNeoSpringing: Bool = false"

              if anchor not in s:
                  raise SystemExit(
                      "Could not find isNeoSpringing property"
                  )

              setting = '''
              @Published var autoNeoSpringAfterFlash: Bool =
                  UserDefaults.standard.object(
                      forKey: "aircard.v10.auto_neospring"
                  ) as? Bool ?? false {
                      didSet {
                          UserDefaults.standard.set(
                              autoNeoSpringAfterFlash,
                              forKey: "aircard.v10.auto_neospring"
                          )
                      }
                  }
              '''

              s = s.replace(
                  anchor,
                  anchor + setting,
                  1
              )

          # ============================================================
          # 3. Disable forced NeoSpring after Flash
          # ============================================================

          if "V10 Auto NeoSpring is OFF" not in s:

              pattern = re.compile(
                  r'(?P<indent>[ \t]*)'
                  r'tendiesFlashLog\.append\('
                  r'"🎉 Wallpapers applied successfully!"'
                  r'\)\s*'
                  r'tendiesFlashLog\.append\('
                  r'"⚡ Triggering NeoSpring respring\.\.\."'
                  r'\)\s*'
                  r'DispatchQueue\.main\.asyncAfter'
                  r'\(deadline: \.now\(\) \+ 0\.6\)'
                  r' \{ \[weak self\] in\s*'
                  r'self\?\.isNeoSpringing = true\s*'
                  r'RespringHelper\.triggerNeoSpring\(\)\s*'
                  r'\}',
                  re.M
              )

              m = pattern.search(s)

              if not m:
                  raise SystemExit(
                      "Could not locate automatic NeoSpring block"
                  )

              i = m.group("indent")

              replacement = (
                  i +
                  'tendiesFlashLog.append('
                  '"🎉 Wallpapers applied successfully!"'
                  ')\n'

                  + i +
                  'if autoNeoSpringAfterFlash {\n'

                  + i +
                  '    tendiesFlashLog.append('
                  '"⚡ V10 Auto NeoSpring is ON — triggering respring..."'
                  ')\n'

                  + i +
                  '    DispatchQueue.main.asyncAfter('
                  'deadline: .now() + 0.6'
                  ') { [weak self] in\n'

                  + i +
                  '        self?.isNeoSpringing = true\n'

                  + i +
                  '        RespringHelper.triggerNeoSpring()\n'

                  + i +
                  '    }\n'

                  + i +
                  '} else {\n'

                  + i +
                  '    tendiesFlashLog.append('
                  '"🧪 V10 Auto NeoSpring is OFF — '
                  'complete flash log preserved. '
                  'Use manual Respring when ready."'
                  ')\n'

                  + i +
                  '}'
              )

              s = (
                  s[:m.start()]
                  + replacement
                  + s[m.end():]
              )

          vm.write_text(s)

          print("Patched AppViewModel:")
          print(vm)

          # ============================================================
          # 4. Locate TendiesView / Wallpapers page
          # ============================================================

          view = next(
              (
                  p for p in swift_files
                  if "Force PosterBoard Cache Refresh"
                  in p.read_text(errors="ignore")
                  and "Respring (NeoSpring)"
                  in p.read_text(errors="ignore")
              ),
              None
          )

          if view is None:
              raise SystemExit(
                  "Could not locate TendiesView"
              )

          v = view.read_text()

          # ============================================================
          # 5. Put Auto NeoSpring directly below
          #    Force PosterBoard Cache Refresh
          #
          #    We deliberately anchor against Section 3.
          # ============================================================

          if "Auto NeoSpring After Flash" not in v:

              section3 = (
                  "// Section 3: Wallpapers Gallery"
              )

              pos = v.find(section3)

              if pos < 0:
                  raise SystemExit(
                      "Could not locate Wallpapers Gallery marker"
                  )

              line_start = v.rfind(
                  "\n",
                  0,
                  pos
              ) + 1

              indent = v[line_start:pos]

              auto_section = (
                  indent +
                  "Section {\n"

                  + indent +
                  "    Toggle("
                  "isOn: $vm.autoNeoSpringAfterFlash"
                  ") {\n"

                  + indent +
                  "        VStack("
                  "alignment: .leading, spacing: 2"
                  ") {\n"

                  + indent +
                  '            Text('
                  '"Auto NeoSpring After Flash"'
                  ')\n'

                  + indent +
                  "                "
                  ".font(.subheadline.weight(.medium))\n"

                  + indent +
                  '            Text('
                  '"OFF keeps AirCard open and preserves '
                  'the complete flash log."'
                  ')\n'

                  + indent +
                  "                "
                  ".font(.caption2)\n"

                  + indent +
                  "                "
                  ".foregroundColor(.secondary)\n"

                  + indent +
                  "        }\n"

                  + indent +
                  "    }\n"

                  + indent +
                  "}\n\n"
              )

              v = (
                  v[:line_start]
                  + auto_section
                  + v[line_start:]
              )

          # ============================================================
          # 6. Remove custom blue tint if one somehow exists
          # ============================================================

          auto_pos = v.find(
              'Text("Auto NeoSpring After Flash")'
          )

          gallery_pos = v.find(
              "// Section 3: Wallpapers Gallery"
          )

          if auto_pos < 0:
              raise SystemExit(
                  "Auto NeoSpring UI was not inserted"
              )

          if gallery_pos < 0:
              raise SystemExit(
                  "Gallery marker disappeared"
              )

          region_start = v.rfind(
              "Section {",
              0,
              auto_pos
          )

          region_end = gallery_pos

          region = v[
              region_start:region_end
          ]

          region = region.replace(
              ".tint(.blue)",
              ""
          )

          v = (
              v[:region_start]
              + region
              + v[region_end:]
          )

          # ============================================================
          # 7. Update footer
          # ============================================================

          old_footer = (
              'Text("Flashing will automatically trigger '
              'NeoSpring to respring the device and apply '
              'your new wallpapers.")'
          )

          new_footer = (
              'Text("V10.1: Auto NeoSpring is OFF by default. '
              'Review the complete flash log, then use manual '
              'Respring when ready.")'
          )

          v = v.replace(
              old_footer,
              new_footer
          )

          # ============================================================
          # 8. Verify UI order
          # ============================================================

          cache_pos = v.find(
              'Text("Force PosterBoard Cache Refresh")'
          )

          auto_pos = v.find(
              'Text("Auto NeoSpring After Flash")'
          )

          gallery_pos = v.find(
              "// Section 3: Wallpapers Gallery"
          )

          if not (
              0 <= cache_pos
              < auto_pos
              < gallery_pos
          ):
              raise SystemExit(
                  "V10.1 settings layout verification failed"
              )

          # Auto NeoSpring must NOT have its own blue tint.
          auto_region = v[
              auto_pos:gallery_pos
          ]

          if ".tint(.blue)" in auto_region:
              raise SystemExit(
                  "Auto NeoSpring still contains blue tint"
              )

          view.write_text(v)

          print(
              "Verified layout: "
              "Cache Refresh -> Auto NeoSpring -> Gallery"
          )

          print(
              "Verified color: "
              "Auto NeoSpring uses default Toggle tint"
          )

          # ============================================================
          # 9. Version = 10.1 / Build = 1010
          # ============================================================

          pbx = next(
              Path(".").rglob(
                  "project.pbxproj"
              ),
              None
          )

          if pbx is None:
              raise SystemExit(
                  "project.pbxproj not found"
              )

          x = pbx.read_text()

          x, version_count = re.subn(
              r'MARKETING_VERSION\s*=\s*[^;]+;',
              'MARKETING_VERSION = 10.1;',
              x
          )

          x, build_count = re.subn(
              r'CURRENT_PROJECT_VERSION\s*=\s*[^;]+;',
              'CURRENT_PROJECT_VERSION = 1010;',
              x
          )

          if (
              version_count == 0
              or build_count == 0
          ):
              raise SystemExit(
                  "Could not patch Xcode version"
              )

          pbx.write_text(x)

          print(
              "AirCard Fluidity V10.1 patch complete"
          )

          PY

      - name: Detect Xcode project
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          PROJ="$(
            find . \
            -name '*.xcodeproj' \
            -print \
            -quit
          )"

          if [ -z "$PROJ" ]; then
            echo "::error::No Xcode project found"
            exit 1
          fi

          DIR="$(dirname "$PROJ")"
          NAME="$(basename "$PROJ")"

          SCHEME="$(
            cd "$DIR"

            xcodebuild \
              -project "$NAME" \
              -list \
              -json |
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          schemes = (
              data
              .get("project", {})
              .get("schemes", [])
          )

          print(
              schemes[0]
              if schemes
              else ""
          )
          '
          )"

          if [ -z "$SCHEME" ]; then
            echo "::error::No Xcode scheme found"
            exit 1
          fi

          echo "Project: $PROJ"
          echo "Scheme: $SCHEME"

          echo "dir=$DIR" \
            >> "$GITHUB_OUTPUT"

          echo "project=$NAME" \
            >> "$GITHUB_OUTPUT"

          echo "scheme=$SCHEME" \
            >> "$GITHUB_OUTPUT"

      - name: Build AirCard V10.1
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.xcode.outputs.dir }}"

          xcodebuild \
            -project "${{ steps.xcode.outputs.project }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AirCardV101" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=10.1 \
            CURRENT_PROJECT_VERSION=1010 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find \
              "$RUNNER_TEMP/AirCardV101/Build/Products/Release-iphoneos" \
              -maxdepth 1 \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then
            echo "::error::Built .app not found"
            exit 1
          fi

          PLIST="$APP/Info.plist"

          BUNDLE_ID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$PLIST"
          )"

          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$PLIST"
          )"

          BUILD="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$PLIST"
          )"

          echo "Bundle ID: $BUNDLE_ID"
          echo "Version: $VERSION"
          echo "Build: $BUILD"

          if [ "$VERSION" != "10.1" ]; then
            echo "::error::Wrong version"
            exit 1
          fi

          if [ "$BUILD" != "1010" ]; then
            echo "::error::Wrong build number"
            exit 1
          fi

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find \
              "$RUNNER_TEMP/AirCardV101/Build/Products/Release-iphoneos" \
              -maxdepth 1 \
              -name '*.app' \
              -print \
              -quit
          )"

          rm -rf Payload
          rm -rf release

          mkdir -p Payload
          mkdir -p release

          cp -R "$APP" Payload/

          # Store mode = much faster than recompressing
          zip \
            -0 \
            -q \
            -r \
            "release/$IPA_NAME" \
            Payload

          unzip \
            -Z1 \
            "release/$IPA_NAME" |
            grep -q '^Payload/.*\.app/'

          shasum \
            -a 256 \
            "release/$IPA_NAME" \
            > release/AirCard-V10.1-SHA256.txt

          echo "IPA:"
          ls -lh \
            "release/$IPA_NAME"

          echo "SHA-256:"
          cat \
            release/AirCard-V10.1-SHA256.txt

      - name: Publish standalone V10.1 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          TAG="v10.1-fluidity"
          TITLE="AirCard Fluidity V10.1"

          if gh release view "$TAG" \
            >/dev/null 2>&1
          then

            echo \
              "Updating existing V10.1 Release"

            gh release upload \
              "$TAG" \
              "release/$IPA_NAME" \
              release/AirCard-V10.1-SHA256.txt \
              --clobber

          else

            echo \
              "Creating standalone V10.1 Release"

            gh release create \
              "$TAG" \
              "release/$IPA_NAME" \
              release/AirCard-V10.1-SHA256.txt \
              --title "$TITLE" \
              --notes "AirCard Fluidity V10.1 integrated build."

          fi 
