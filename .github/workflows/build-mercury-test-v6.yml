name: Build AirCard Mercury Test v6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Mercury v6
        run: |
          grep -n "preservesMercuryDescriptorUUID" ios-app/TendiesEngine.swift
          grep -n "sourceDescriptorUUID" ios-app/TendiesEngine.swift
          grep -n "preserveSemanticIdentifiers" ios-app/TendiesEngine.swift
          grep -n "PersistedPosterContainerBundleIdentifiers" ios-app/TendiesEngine.swift
          grep -n '"com.apple.MercuryPoster"' ios-app/TendiesEngine.swift

      - name: Build IPA
        run: |
          chmod +x build-ipa.sh
          ./build-ipa.sh
          test -f build/AirCard-iOS.ipa
          cp build/AirCard-iOS.ipa build/AirCard-Mercury-Test-v6.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-Mercury-Test-v6
          path: build/AirCard-Mercury-Test-v6.ipa

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mercury-test-v6 --cleanup-tag -y 2>/dev/null || true
          gh release create mercury-test-v6 build/AirCard-Mercury-Test-v6.ipa --target "${{ github.sha }}" --title "AirCard Mercury Test v6" --notes "Mercury Test v6 - keeps V5 descriptor behavior and adds com.apple.MercuryPoster to PosterBoard PersistedPosterContainerBundleIdentifiers."
