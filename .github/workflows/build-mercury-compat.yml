name: Build AirCard Mercury Compatibility

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Mercury compatibility
        run: |
          grep -n "preserveSemanticIdentifiers" ios-app/TendiesEngine.swift
          grep -n "wallpaperRepresentingIdentifier" ios-app/TendiesEngine.swift
          grep -n 'plist\["identifier"\]' ios-app/TendiesEngine.swift
          grep -n "com.apple.MercuryPoster" ios-app/TendiesEngine.swift

      - name: Build IPA
        run: |
          chmod +x build-ipa.sh
          ./build-ipa.sh
          test -f build/AirCard-iOS.ipa
          cp build/AirCard-iOS.ipa build/AirCard-Mercury-Compat.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-Mercury-Compat
          path: build/AirCard-Mercury-Compat.ipa

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mercury-compat --cleanup-tag -y 2>/dev/null || true
          gh release create mercury-compat build/AirCard-Mercury-Compat.ipa --target "${{ github.sha }}" --title "AirCard Mercury Compatibility" --notes "MercuryPoster compatibility build. Preserves Mercury semantic identifiers while retaining randomized instance storage UUIDs."
