name: AirCard Overwrite Proof 9.9 Fast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      IPA_NAME: AirCard-OVERWRITE-PROOF-9.9-build999-FAST.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch version and visible UI marker
        shell: bash
        run: |
          set -euo pipefail

          PBX="$(find . -name project.pbxproj -print -quit)"
          test -n "$PBX" || { echo "::error::project.pbxproj not found"; exit 1; }

          python3 - "$PBX" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s, a = re.subn(r'MARKETING_VERSION\s*=\s*[^;]+;', 'MARKETING_VERSION = 9.9;', s)
          s, b = re.subn(r'CURRENT_PROJECT_VERSION\s*=\s*[^;]+;', 'CURRENT_PROJECT_VERSION = 999;', s)
          if not a or not b:
              raise SystemExit("Version/build fields not found")
          p.write_text(s)
          PY

          # The previous run proved CFBundleDisplayName is generated elsewhere,
          # so don't make display-name rewriting a build blocker.
          # For overwrite proof, patch the visible in-app v1.3 marker instead.
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          for p in Path(".").rglob("*.swift"):
              try:
                  s = p.read_text()
              except Exception:
                  continue
              n = s.replace("iOS 27 · v1.3", "iOS 27 · v9.9-OVERWRITE-TEST")
              n = n.replace("iOS 27 • v1.3", "iOS 27 · v9.9-OVERWRITE-TEST")
              n = n.replace('"v1.3"', '"v9.9-OVERWRITE-TEST"')
              if n != s:
                  p.write_text(n)
                  changed.append(str(p))
          print("Patched Swift files:", changed)
          PY

      - name: Detect project and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$(find . -name '*.xcodeproj' -print -quit)"
          test -n "$PROJ" || { echo "::error::No Xcode project"; exit 1; }
          DIR="$(dirname "$PROJ")"
          NAME="$(basename "$PROJ")"
          SCHEME="$(cd "$DIR" && xcodebuild -project "$NAME" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"
          test -n "$SCHEME" || { echo "::error::No scheme"; exit 1; }
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "project=$NAME" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      # No brew install / cargo install. The repository's Xcode build is used
      # exactly as normal; this removes the slow dependency-install stage.
      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.xcode.outputs.dir }}"
          xcodebuild \
            -project "${{ steps.xcode.outputs.project }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AirCardBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=9.9 \
            CURRENT_PROJECT_VERSION=999 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify and package quickly
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/AirCardBuild/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP" || { echo "::error::Built .app not found"; exit 1; }

          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          DISPLAY=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist" 2>/dev/null || true)

          echo "Bundle ID: $ID"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          echo "Display name: $DISPLAY"

          [ "$VERSION" = "9.9" ] || exit 1
          [ "$BUILD" = "999" ] || exit 1

          rm -rf Payload release
          mkdir -p Payload release
          cp -R "$APP" Payload/

          # Fast zip: IPA contents are already compressed binaries/assets.
          # -0 avoids spending minutes recompressing them.
          /usr/bin/zip -0qry "release/$IPA_NAME" Payload

          # Fast structural checks; no full unzip -t pass.
          unzip -Z1 "release/$IPA_NAME" | grep -q '^Payload/.*\.app/'
          tail -c 65557 "release/$IPA_NAME" | grep -a -q 'PK' || {
            echo "::error::ZIP end record not found"
            exit 1
          }

          shasum -a 256 "release/$IPA_NAME" > release/SHA256-OVERWRITE-PROOF.txt
          ls -lh "release/$IPA_NAME"

      - name: Replace Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest \
              "release/$IPA_NAME" \
              release/SHA256-OVERWRITE-PROOF.txt \
              --clobber
          else
            gh release create latest \
              "release/$IPA_NAME" \
              release/SHA256-OVERWRITE-PROOF.txt \
              --title "AirCard Overwrite Proof 9.9 FAST" \
              --prerelease
          fi
