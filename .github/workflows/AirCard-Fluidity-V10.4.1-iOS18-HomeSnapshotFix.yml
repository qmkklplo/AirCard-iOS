name: AirCard Fluidity V10.4 ZH-CN iOS18 Dynamic + Home Blur

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      IPA_NAME: AirCard-iOS-Fluidity-V10.4-iOS18-Dynamic-HomeBlur-ZH.ipa

    steps:
      - name: Checkout V8 source
        uses: actions/checkout@v5

      - name: Integrate V10 features
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          files = list(Path(".").rglob("*.swift"))

          # V10.4: restore V8 true App Container passthrough before descriptor discovery/randomization.
          engine = Path("ios-app/TendiesEngine.swift")
          if not engine.exists():
              raise SystemExit("TendiesEngine.swift not found")
          es = engine.read_text()
          if "V8 Container Tendie detected" not in es:
              marker = '            log("  🖼 Locating wallpaper descriptors…")\n'
              if marker not in es:
                  raise SystemExit("V8 passthrough insertion marker not found; refusing to build stock descriptor path")
              swift_lines = [
                  '            // Fluidity V8: true Nugget-style container passthrough.',
                  '            // Preserve container paths, UUIDs and semantic identifiers.',
                  '            // Safety: refuse any container carrying PosterBoard SQLite database.',
                  '            let containerStage = tempStageDir.appendingPathComponent("container")',
                  '            if item.isContainer && FileManager.default.fileExists(atPath: containerStage.path) {',
                  '                if item.unsafeContainer && item.name != "iOS27-Fluidity-Add-V3-Registered" {',
                  '                    throw NSError(',
                  '                        domain: "TendiesEngine",',
                  '                        code: 27,',
                  '                        userInfo: [NSLocalizedDescriptionKey: "Unsafe container Tendie refused: PosterBoard SQLite database is present."]',
                  '                    )',
                  '                }',
                  '                if item.unsafeContainer {',
                  '                    log("  Fluidity registration package authorized — writing paired PosterBoard DB snapshot")',
                  '                }',
                  '',
                  '                log("  📦 V8 Container Tendie detected — preserving original paths and identifiers")',
                  '                try await writeDirectoryTree(',
                  '                    sourceBaseDir: containerStage,',
                  '                    targetBaseDir: normalizedContainer,',
                  '                    pairingPath: pairingPath,',
                  '                    log: log',
                  '                )',
                  '                log("  ✅ V8 container tree injected without descriptor UUID/ID randomization")',
                  '                progress(Double(itemIndex + 1) / (totalItems + 1))',
                  '                continue',
                  '            }',
                  '',
              ]
              v8patch = "\n".join(swift_lines) + "\n"
              es = es.replace(marker, v8patch + marker, 1)
              engine.write_text(es)

          es = engine.read_text()
          required = ["V8 Container Tendie detected", "sourceBaseDir: containerStage", "targetBaseDir: normalizedContainer", "Unsafe container Tendie refused", "Fluidity registration package authorized"]
          missing = [x for x in required if x not in es]
          if missing:
              raise SystemExit("V8 passthrough verification failed: " + ", ".join(missing))
          print("Patched: ios-app/TendiesEngine.swift — V8 App Container passthrough VERIFIED")

          vm = next((p for p in files if "flashTendies" in p.read_text(errors="ignore") and "triggerNeoSpring" in p.read_text(errors="ignore")), None)
          if vm is None:
              raise SystemExit("Could not locate flashTendies view-model")
          s = vm.read_text()

          anchor = '@Published var isNeoSpringing: Bool = false'
          if "autoNeoSpringAfterFlash" not in s:
              if anchor not in s:
                  raise SystemExit("isNeoSpringing anchor missing")
              setting = """
              @Published var autoNeoSpringAfterFlash: Bool = UserDefaults.standard.object(forKey: "aircard.v10.auto_neospring") as? Bool ?? false {
                  didSet {
                      UserDefaults.standard.set(autoNeoSpringAfterFlash, forKey: "aircard.v10.auto_neospring")
                  }
              }
              """
              s = s.replace(anchor, anchor + setting, 1)

          if "V10 Auto NeoSpring is OFF" not in s:
              pattern = re.compile(
                  r'(?P<indent>[ \t]*)tendiesFlashLog\.append\("🎉 Wallpapers applied successfully!"\)\s*'
                  r'tendiesFlashLog\.append\("⚡ Triggering NeoSpring respring\.\.\."\)\s*'
                  r'DispatchQueue\.main\.asyncAfter\(deadline: \.now\(\) \+ 0\.6\) \{ \[weak self\] in\s*'
                  r'self\?\.isNeoSpringing = true\s*'
                  r'RespringHelper\.triggerNeoSpring\(\)\s*\}',
                  re.M
              )
              m = pattern.search(s)
              if not m:
                  raise SystemExit("Automatic NeoSpring block not found")
              i = m.group("indent")
              replacement = (
                  i + 'tendiesFlashLog.append("🎉 Wallpapers applied successfully!")\n'
                  + i + 'if autoNeoSpringAfterFlash {\n'
                  + i + '    tendiesFlashLog.append("⚡ V10 Auto NeoSpring is ON — triggering respring...")\n'
                  + i + '    DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) { [weak self] in\n'
                  + i + '        self?.isNeoSpringing = true\n'
                  + i + '        RespringHelper.triggerNeoSpring()\n'
                  + i + '    }\n'
                  + i + '} else {\n'
                  + i + '    tendiesFlashLog.append("🧪 V10 Auto NeoSpring is OFF — complete flash log preserved. Use manual Respring when ready.")\n'
                  + i + '}'
              )
              s = s[:m.start()] + replacement + s[m.end():]
          vm.write_text(s)
          print("Patched:", vm)

          view = next((p for p in files if 'Respring (NeoSpring)' in p.read_text(errors="ignore")), None)
          if view is None:
              raise SystemExit("Wallpapers view not found")
          v = view.read_text()

          if "Auto NeoSpring After Flash" not in v:
              marker = "// Section 3: Wallpapers Gallery"
              pos = v.find(marker)
              if pos < 0:
                  raise SystemExit("Wallpapers Gallery marker not found")
              line_start = v.rfind("\n", 0, pos) + 1
              i = v[line_start:pos]
              toggle = (
                  i + 'Section {\n'
                  + i + '    Toggle(isOn: $vm.autoNeoSpringAfterFlash) {\n'
                  + i + '        VStack(alignment: .leading, spacing: 2) {\n'
                  + i + '            Text("Auto NeoSpring After Flash")\n'
                  + i + '                .font(.subheadline.bold())\n'
                  + i + '            Text("OFF keeps AirCard open and preserves the complete flash log.")\n'
                  + i + '                .font(.caption)\n'
                  + i + '                .foregroundStyle(.secondary)\n'
                  + i + '        }\n'
                  + i + '    }\n'
                  + i + '}\n\n'
              )
              v = v[:line_start] + toggle + v[line_start:]

          cache_pos = v.find("Force PosterBoard Cache Refresh")
          auto_pos = v.find("Auto NeoSpring After Flash")
          gallery_pos = v.find("// Section 3: Wallpapers Gallery")
          if not (0 <= cache_pos < auto_pos < gallery_pos):
              raise SystemExit("V10.2 UI placement verification failed")

          v = v.replace(
              'Text("Flashing will automatically trigger NeoSpring to respring the device and apply your new wallpapers.")',
              'EmptyView()'
          )
          view.write_text(v)
          print("Patched:", view)

          # V10.3 Simplified Chinese UI localization.
          # Only user-visible Swift string literals are translated.
          translations = {
              # App name "AirCard-iOS" is intentionally NOT translated.
              "Pairing": "配对", "Wallet Cards": "钱包卡片", "Passcode": "密码", "Wallpapers": "壁纸",
              "Credits": "致谢", "Network": "网络", "Active Pairing": "当前配对", "Pair on This iPhone": "在此 iPhone 上配对",
              "Loopback VPN Active": "回环 VPN 已连接", "Loopback VPN Not Detected": "未检测到回环 VPN",
              "RSD tunnel ready — exploit will connect.": "RSD 隧道已就绪 — 可建立连接。",
              "Not Paired": "未配对", "Tap 'Pair This iPhone' below to pair.": "点击下方“配对此 iPhone”开始配对。",
              "Pair This iPhone": "配对此 iPhone", "Re-Pair This iPhone": "重新配对此 iPhone", "Cancel Pairing": "取消配对",
              "Paired successfully! ✅": "配对成功！✅", "Pairing file deleted": "配对文件已删除",
              "Device IP:": "设备 IP：", "Ready to exploit ✅": "连接已就绪 ✅",
              "Apply custom wallet card skins and passcode themes on-device using the AirTraffic sandbox escape.": "使用 AirTraffic 沙盒逃逸直接在设备上应用自定义钱包卡片皮肤和密码主题。",
              "Scan Cards": "扫描卡片", "Stop Scan": "停止扫描", "Wallet Cards": "钱包卡片",
              "No Cards Detected Yet": "尚未检测到卡片", "Tap **Scan Cards** in the toolbar above.": "点击上方工具栏中的“扫描卡片”。",
              "On this iPhone, **double-click the Side button** (Apple Pay), authenticate with **Face ID**, and **tap your card**.": "在此 iPhone 上，连按两下侧边按钮（Apple Pay），使用 Face ID 验证，然后点击你的卡片。",
              "Your card will appear here automatically!": "你的卡片会自动显示在这里！", "Add Manually": "手动添加",
              "Add Card Manually": "手动添加卡片", "Add Card": "添加卡片", "Clear All Cards": "清除所有卡片",
              "Open Apple Pay (double-click Side button) and tap your card…": "打开 Apple Pay（连按两下侧边按钮）并点击你的卡片…",
              "Live Scanner Active": "实时扫描已开启", "Scanner Status": "扫描状态", "Card Hash": "卡片哈希",
              "Assign Card Skin": "分配卡片皮肤", "Set Skin for All Cards...": "为所有卡片设置皮肤…",
              "Passcode Theme": "密码主题", "Passcode Themes": "密码主题", "Apply .passthm": "应用 .passthm",
              "Create Theme": "创建主题", "Browse Files": "浏览文件", "Choose .passthm from Files…": "从文件选择 .passthm…",
              "Change .passthm…": "更换 .passthm…", "Theme Information": "主题信息", "Files in theme": "主题中的文件",
