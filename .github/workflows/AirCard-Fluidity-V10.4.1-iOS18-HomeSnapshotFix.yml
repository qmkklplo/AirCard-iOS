              "Suggested Photos": "推荐照片", "Poster Image": "海报图像", "Preview": "预览", "Zoom & Framing": "缩放与构图",
              "Slicing Style": "切片样式", "Circle Buttons": "圆形按键", "Seamless Poster": "无缝海报", "Individual Keys": "独立按键",
              "Drag preview to reposition": "拖动预览以调整位置", "Drag anywhere on the dialer preview to reposition": "拖动拨号盘预览任意位置以调整位置",
              "Reset Position": "重置位置", "Tap to choose photo": "点击选择照片", "Select Photo for Keypad…": "为键盘选择照片…",
              "Export .passthm...": "导出 .passthm…", "Flash & Language Target": "刷入与语言目标", "System Language": "系统语言",
              "All Languages (Universal)": "所有语言（通用）", "Universal (All)": "通用（全部）", "Universal (Regular + Bold)": "通用（常规 + 粗体）",
              "Font Weight / Style": "字体粗细 / 样式", "Regular Font Only (Fast)": "仅常规字体（快速）", "Bold Text Only (Fast)": "仅粗体（快速）",
              "Wallpaper": "壁纸", "Wallpapers Gallery": "壁纸库", "Import More Wallpapers…": "导入更多壁纸…",
              "Choose .tendies from Files…": "从文件选择 .tendies…", "PosterBoard container will be auto-detected automatically on flash.": "刷入时将自动检测 PosterBoard 容器。",
              "Force PosterBoard Cache Refresh": "强制刷新 PosterBoard 缓存", "Resets file protections so iOS re-indexes wallpapers immediately": "重置文件保护，使 iOS 立即重新索引壁纸",
              "Auto NeoSpring After Flash": "刷入后自动 NeoSpring", "OFF keeps AirCard open and preserves the complete flash log.": "关闭后保持 AirCard 运行，并保留完整刷入日志。",
              "Deselect All": "取消全选", "Select All": "全选", "No .tendies wallpapers loaded yet": "尚未载入 .tendies 壁纸",
              "Tap 'Choose .tendies from Files' or copy wallpapers into On My iPhone › AirCard-iOS.": "点击“从文件选择 .tendies”，或将壁纸复制到“我的 iPhone › AirCard-iOS”。",
              "Flashing Wallpapers…": "正在刷入壁纸…", "Flashing…": "正在刷入…", "Respring (NeoSpring)": "重启桌面（NeoSpring）",
              "Imported": "已导入", "App Container": "App 容器", "Descriptor Archive": "描述符归档", "Descriptor": "描述符", "Descriptors": "描述符",
              "Target Extension": "目标扩展", "Format": "格式", "Name": "名称", "Type": "类型", "Information": "信息",
              "Close": "关闭", "Done": "完成", "Cancel": "取消", "Delete": "删除", "Clear": "清除", "Clear All": "全部清除",
              "Error": "错误", "Warning": "警告", "Notice": "提示", "Success! 🎉": "成功！🎉", "Retry": "重试", "Load": "载入", "Copy": "复制", "Copied": "已复制",
              "Cancelled": "已取消", "Cancelled.": "已取消。", "OK": "好", "Stop": "停止", "Add": "添加",
              "Setup LocalDevVPN:": "设置 LocalDevVPN：", "Launch LocalDevVPN": "打开 LocalDevVPN", "Open Settings App Now": "立即打开设置",
              "1. Open LocalDevVPN app and tap Connect.": "1. 打开 LocalDevVPN 并点击连接。",
              "2. Return to AirCard-iOS — status indicator turns green.": "2. 返回 AirCard-iOS — 状态指示器会变为绿色。",
              "Connect LocalDevVPN before running flashes.": "刷入前请先连接 LocalDevVPN。",
              "Local Network permission is off. Enable it in Settings › AirCard-iOS › Local Network.": "本地网络权限已关闭。请前往“设置 › AirCard-iOS › 本地网络”开启。",
              "Failed to find PosterBoard container": "未找到 PosterBoard 容器", "PosterBoard Container path is required.": "需要 PosterBoard 容器路径。",
              "PosterBoard container could not be found automatically. Ensure LocalDevVPN is connected and iPhone is unlocked.": "无法自动找到 PosterBoard 容器。请确认 LocalDevVPN 已连接且 iPhone 已解锁。",
              "No wallpapers selected to flash.": "未选择要刷入的壁纸。", "No wallpapers found": "未找到壁纸",
              "Flashing will automatically trigger NeoSpring to respring the device and apply your new wallpapers.": "刷入完成后将自动触发 NeoSpring 重启桌面并应用新壁纸。",
              "Target: PosterBoard container detected ✅": "目标：已检测到 PosterBoard 容器 ✅",
              "Apple Wallet Skins & Passcode Themes for iOS 18+": "适用于 iOS 18+ 的 Apple 钱包皮肤与密码主题",
              "Lead & Core Developer": "主要与核心开发者", "Base IPA Developer": "基础 IPA 开发者", "Core Exploit": "核心漏洞利用",
          }

          # Translate exact Swift string literals only. This avoids touching
          # identifiers, bundle IDs, AirLift protocol strings and file formats.
          for swift_file in Path(".").rglob("*.swift"):
              text = swift_file.read_text(errors="ignore")
              original_text = text
              for en, zh in translations.items():
                  text = text.replace('"' + en + '"', '"' + zh + '"')
              # Localize interpolated/dynamic UI strings that exact literal replacement cannot catch.
              text = re.sub(r'"Wallet Cards \(\(cards\.count\)\)"', '"钱包卡片 (\(cards.count))"', text)
              text = re.sub(r'"\(\(importedTendies\.count\)\) Wallpapers Imported"', '"已导入 \(importedTendies.count) 个壁纸"', text)
              text = re.sub(r'"\(\(importedTendies\.count\)\) Wallpaper Imported"', '"已导入 \(importedTendies.count) 个壁纸"', text)
              text = re.sub(r'"Flash \(\(selectedCount\)\) Wallpaper"', '"刷入 \(selectedCount) 个壁纸"', text)
              text = re.sub(r'"Flash \(\(selectedCount\)\) Wallpapers"', '"刷入 \(selectedCount) 个壁纸"', text)
              text = re.sub(r'"Flash \(\(selected\.count\)\) Wallpaper"', '"刷入 \(selected.count) 个壁纸"', text)
              text = re.sub(r'"Flash \(\(selected\.count\)\) Wallpapers"', '"刷入 \(selected.count) 个壁纸"', text)
              # Broader safe UI-only substitutions for labels seen in the app.
              text = text.replace('"Wallet Cards (\(cards.count))"', '"钱包卡片 (\(cards.count))"')
              text = text.replace('"\(importedTendies.count) Wallpapers Imported"', '"已导入 \(importedTendies.count) 个壁纸"')
              text = text.replace('"\(importedTendies.count) Wallpaper Imported"', '"已导入 \(importedTendies.count) 个壁纸"')
              if text != original_text:
                  swift_file.write_text(text)
                  print("Localized:", swift_file)

          # V10.4: make the two wallpaper setting sections use system blue.
          # Localization has already run, so use the final Chinese labels.
          # Apply tint to the enclosing Section rather than inserting a modifier
          # into the middle of a Toggle expression.
          def tint_enclosing_section(source, label):
              label_pos = source.find(label)
              if label_pos < 0:
                  raise SystemExit(f"Wallpaper setting label not found: {label}")
              section_pos = source.rfind("Section {", 0, label_pos)
              if section_pos < 0:
                  raise SystemExit(f"Section start not found for: {label}")
              brace_pos = source.find("{", section_pos)
              depth = 0
              in_string = False
              escape = False
              end_pos = None
              for idx in range(brace_pos, len(source)):
                  ch = source[idx]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                      continue
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end_pos = idx + 1
                          break
              if end_pos is None:
                  raise SystemExit(f"Section end not found for: {label}")
              if re.match(r'\s*\.tint\(\.blue\)', source[end_pos:end_pos + 80]):
                  return source
              line_start = source.rfind("\n", 0, section_pos) + 1
              indent = re.match(r"^[ \t]*", source[line_start:section_pos]).group(0)
              return source[:end_pos] + "\n" + indent + ".tint(.blue)" + source[end_pos:]

          wallpaper_file = next((p for p in Path(".").rglob("*.swift") if "强制刷新 PosterBoard 缓存" in p.read_text(errors="ignore") and "刷入后自动 NeoSpring" in p.read_text(errors="ignore")), None)
          if wallpaper_file is None:
              raise SystemExit("Localized wallpaper settings file not found")
          blue_text = wallpaper_file.read_text()
          blue_text = tint_enclosing_section(blue_text, "强制刷新 PosterBoard 缓存")
          blue_text = tint_enclosing_section(blue_text, "刷入后自动 NeoSpring")
          wallpaper_file.write_text(blue_text)
          print("Applied blue tint to wallpaper setting sections:", wallpaper_file)

          pbx = next(Path(".").rglob("project.pbxproj"), None)
          if pbx is None:
              raise SystemExit("project.pbxproj not found")
          x = pbx.read_text()
          x, a = re.subn(r'MARKETING_VERSION\s*=\s*[^;]+;', 'MARKETING_VERSION = 10.4;', x)
          x, b = re.subn(r'CURRENT_PROJECT_VERSION\s*=\s*[^;]+;', 'CURRENT_PROJECT_VERSION = 1040;', x)
          if not a or not b:
              raise SystemExit("Version fields not found")
          pbx.write_text(x)

          # Final guard: reject stale version literals before compilation.
          stale = ["10.3.6", "1036", "AirCardV1036"]
          leftovers = [token for token in stale if token in pbx.read_text()]
          if leftovers:
              raise SystemExit("Stale version literals remain in project: " + ", ".join(leftovers))

          print("V10.4 Fluidity Registration integration complete")
          PY

      - name: Integrate switchable iOS18 Fluidity dynamic mode
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          engine = Path("ios-app/TendiesEngine.swift")
          if not engine.exists():
              raise SystemExit("TendiesEngine.swift not found")
          s = engine.read_text()

          helper = r'''
              // MARK: - iOS 18 Fluidity Dynamic Mode

              private var isIOS18FluidityDynamicEnabled: Bool {
                  UserDefaults.standard.object(forKey: "aircard.v10.ios18_fluidity_dynamic") as? Bool ?? true
              }

              private func applyIOS18FluidityDynamicMode(
                  in folderURL: URL,
                  log: @escaping (String) -> Void
              ) {
                  let fm = FileManager.default
                  var patchedIdentifiers = 0
                  var patchedUserInfo = 0

                  guard let enumerator = fm.enumerator(
                      at: folderURL,
                      includingPropertiesForKeys: [.isRegularFileKey],
                      options: [.skipsHiddenFiles]
                  ) else {
                      log("    ⚠️ iOS 18 Fluidity 动态模式：无法枚举 MercuryPoster 数据")
                      return
                  }

                  while let fileURL = enumerator.nextObject() as? URL {
                      let name = fileURL.lastPathComponent

                      if name == "com.apple.posterkit.provider.descriptor.identifier" {
                          if let data = "fluidity.dynamic".data(using: .utf8) {
                              try? data.write(to: fileURL, options: .atomic)
                              patchedIdentifiers += 1
                          }
                          continue
                      }

                      guard name == "com.apple.posterkit.provider.contents.userInfo" else { continue }
                      guard let data = try? Data(contentsOf: fileURL),
                            var plist = (try? PropertyListSerialization.propertyList(
                                from: data,
                                options: .mutableContainers,
                                format: nil
                            )) as? [String: Any] else { continue }

                      plist["appearanceMode"] = "Automatic"
                      plist["lookIdentifier"] = "dynamic"

                      if let out = try? PropertyListSerialization.data(
                          fromPropertyList: plist,
                          format: .binary,
                          options: 0
                      ) {
                          try? out.write(to: fileURL, options: .atomic)
                          patchedUserInfo += 1
                      }
                  }

                  log("    🧪 iOS 18 Fluidity 动态模式：descriptor=fluidity.dynamic, appearanceMode=Automatic, lookIdentifier=dynamic")
                  log("    🧪 Fluidity 动态模式修改结果： descriptorIdentifier=\(patchedIdentifiers), userInfo=\(patchedUserInfo)")
              }

          '''

          if "applyIOS18FluidityDynamicMode" not in s:
              markers = [
                  "    // MARK: - Plist Identifier Handling\n",
                  "    // MARK: - Plist Identifier Randomization (Matches Nugget implementation)\n",
                  "    // MARK: - Folder Injector Helper (Single Atomic Move via AirTraffic)\n",
              ]
              marker = next((m for m in markers if m in s), None)
              if marker is None:
                  raise SystemExit("Fluidity helper insertion marker not found")
              s = s.replace(marker, helper + marker, 1)

          current_anchor = '                let preservesSemanticIdentifiers = descItem.ext == "com.apple.MercuryPoster"\n'
          current_replacement = (
              '                if descItem.ext == "com.apple.MercuryPoster" && isIOS18FluidityDynamicEnabled {\n'
              '                    log("  🧪 iOS 18 Fluidity 动态模式已开启 — MercuryPoster descriptor")\n'
              '                    applyIOS18FluidityDynamicMode(in: descItem.url, log: log)\n'
              '                }\n\n'
              '                let preservesSemanticIdentifiers = descItem.ext == "com.apple.MercuryPoster"\n'
          )

          legacy_anchor = '                updatePlistIdentifiers(in: descItem.url, randomizedID: randomizedID)\n'
          legacy_replacement = (
              '                updatePlistIdentifiers(in: descItem.url, randomizedID: randomizedID)\n'
              '                if descItem.ext == "com.apple.MercuryPoster" {\n'
              '                    if isIOS18FluidityDynamicEnabled {\n'
              '                        log("  🧪 iOS 18 Fluidity 动态模式已开启 — MercuryPoster descriptor")\n'
              '                        applyIOS18FluidityDynamicMode(in: descItem.url, log: log)\n'
              '                    } else {\n'
              '                        log("  ⏭ iOS 18 Fluidity 动态模式已关闭 — 保持标准字段")\n'
              '                    }\n'
              '                }\n'
          )

          if "Fluidity 动态模式已开启 — MercuryPoster descriptor" not in s:
              if current_anchor in s:
                  s = s.replace(current_anchor, current_replacement, 1)
              elif legacy_anchor in s:
                  s = s.replace(legacy_anchor, legacy_replacement, 1)
              else:
                  raise SystemExit("Descriptor identifier handling anchor not found")

          container_anchor = '''            if item.isContainer && FileManager.default.fileExists(atPath: containerStage.path) {'''
          container_patch = '''            if item.isContainer && FileManager.default.fileExists(atPath: containerStage.path) {
                let mercuryContainerRoot = containerStage.appendingPathComponent(
                    "Library/Application Support/PRBPosterExtensionDataStore/61/Extensions/com.apple.MercuryPoster"
                )
                if FileManager.default.fileExists(atPath: mercuryContainerRoot.path) {
                    if isIOS18FluidityDynamicEnabled {
                        log("  🧪 iOS 18 Fluidity 动态模式已开启 — MercuryPoster container payload")
                        applyIOS18FluidityDynamicMode(in: mercuryContainerRoot, log: log)
                    } else {
                        log("  ⏭ iOS 18 Fluidity 动态模式已关闭 — Container 保持原始字段")
                    }
                }'''
          if "Fluidity 动态模式已开启 — MercuryPoster container payload" not in s:
              if container_anchor not in s:
                  raise SystemExit("V10.4 container passthrough anchor not found")
              s = s.replace(container_anchor, container_patch, 1)

          engine.write_text(s)
          body = engine.read_text()
          required = [
              "isIOS18FluidityDynamicEnabled",
              "aircard.v10.ios18_fluidity_dynamic",
              "applyIOS18FluidityDynamicMode",
              "fluidity.dynamic",
              'plist["appearanceMode"] = "Automatic"',
              'plist["lookIdentifier"] = "dynamic"',
              'descItem.ext == "com.apple.MercuryPoster"',
              "Fluidity 动态模式已开启 — MercuryPoster container payload",
          ]
          missing = [x for x in required if x not in body]
          if missing:
              raise SystemExit("iOS 18 Fluidity dynamic test integration failed: " + ", ".join(missing))
          print("Switchable iOS 18 Fluidity dynamic mode integrated")
          PY

      - name: Integrate verified iOS18 wallpaper Home Screen Blur control
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          CONFIG_UUID = '459C311E-3615-4485-A24A-33A10CB3A3ED'
          ENGINE_METHOD = '\n    // MARK: - Fluidity iOS18 Wallpaper Home Screen Blur\n\n    public func setFluidityHomeScreenBlur(\n        enabled: Bool,\n        containerPath: String,\n        pairingPath: String,\n        log: @escaping (String) -> Void\n    ) async throws {\n        let configUUID = "459C311E-3615-4485-A24A-33A10CB3A3ED"\n        let supplementRevision = "5"\n        let fileName = "com.apple.posterkit.provider.supplementURL.homescreenConfiguration.plist"\n        let encoded = enabled ? Self.fluidityHomeBlurOnB64 : Self.fluidityHomeBlurOffB64\n        guard let plistData = Data(base64Encoded: encoded) else {\n            throw NSError(domain: "TendiesEngine", code: 1041, userInfo: [NSLocalizedDescriptionKey: "Embedded Home Screen Blur plist is invalid."])\n        }\n\n        var normalizedContainer = containerPath.trimmingCharacters(in: .whitespacesAndNewlines)\n        if normalizedContainer.hasSuffix("/") {\n            normalizedContainer = String(normalizedContainer.dropLast())\n        }\n        guard !normalizedContainer.isEmpty else {\n            throw NSError(domain: "TendiesEngine", code: 1042, userInfo: [NSLocalizedDescriptionKey: "PosterBoard container path is required."])\n        }\n\n        let stageDir = FileManager.default.temporaryDirectory\n            .appendingPathComponent("fluidity_home_blur_\\(UUID().uuidString)")\n        try FileManager.default.createDirectory(at: stageDir, withIntermediateDirectories: true)\n        defer { try? FileManager.default.removeItem(at: stageDir) }\n\n        let plistURL = stageDir.appendingPathComponent(fileName)\n        try plistData.write(to: plistURL, options: .atomic)\n\n        let targetDir = "\\(normalizedContainer)/Library/Application Support/PRBPosterExtensionDataStore/61/Extensions/com.apple.MercuryPoster/configurations/\\(configUUID)/versions/18/supplements/\\(supplementRevision)"\n        log("🌫 Applying iOS18 wallpaper Home Screen Blur = \\(enabled ? "ON" : "OFF")")\n        try await writeDirectoryTree(\n            sourceBaseDir: stageDir,\n            targetBaseDir: targetDir,\n            pairingPath: pairingPath,\n            log: log\n        )\n        log("✅ Home Screen Blur supplement written successfully")\n    }\n\n    private static let fluidityHomeBlurOnB64 = ""\n    private static let fluidityHomeBlurOffB64 = ""\n\n'
          VM_STATE = '\n    @Published var ios18FluidityDynamicEnabled: Bool = UserDefaults.standard.object(forKey: "aircard.v10.ios18_fluidity_dynamic") as? Bool ?? true {\n        didSet {\n            UserDefaults.standard.set(ios18FluidityDynamicEnabled, forKey: "aircard.v10.ios18_fluidity_dynamic")\n        }\n    }\n    @Published var homeScreenBlurEnabled: Bool = UserDefaults.standard.object(forKey: "aircard.v10.home_screen_blur") as? Bool ?? true {\n        didSet {\n            UserDefaults.standard.set(homeScreenBlurEnabled, forKey: "aircard.v10.home_screen_blur")\n        }\n    }\n    @Published var isApplyingHomeScreenBlur: Bool = false\n'
          VM_SYNC = '            tendiesFlashLog.append("🌫 Synchronizing iOS18 wallpaper Home Screen Blur…")\n            try await TendiesEngine.shared.setFluidityHomeScreenBlur(\n                enabled: homeScreenBlurEnabled,\n                containerPath: container,\n                pairingPath: pairingPath,\n                log: { [weak self] line in\n                    DispatchQueue.main.async {\n                        self?.tendiesFlashLog.append(line)\n                    }\n                }\n            )\n'
          VM_FUNC = '    func applyHomeScreenBlurNow() async {\n        let pairingPath = PairingController.pairingFilePath()\n        guard FileManager.default.fileExists(atPath: pairingPath) else {\n            errorMessage = "没有可用的配对文件，请先在配对页面完成配对。"\n            return\n        }\n\n        var container = posterBoardContainer.trimmingCharacters(in: .whitespacesAndNewlines)\n        if container.isEmpty {\n            do {\n                container = try await TendiesEngine.shared.detectPosterBoardContainer(pairingPath: pairingPath)\n                posterBoardContainer = container\n                UserDefaults.standard.set(container, forKey: "aircard.posterboard_container")\n            } catch {\n                errorMessage = "无法自动找到 PosterBoard 容器：\\(error.localizedDescription)"\n                return\n            }\n        }\n\n        isApplyingHomeScreenBlur = true\n        tendiesFlashLog.append("🌫 正在应用主屏幕模糊状态…")\n        defer { isApplyingHomeScreenBlur = false }\n\n        do {\n            try await TendiesEngine.shared.setFluidityHomeScreenBlur(\n                enabled: homeScreenBlurEnabled,\n                containerPath: container,\n                pairingPath: pairingPath,\n                log: { [weak self] line in\n                    DispatchQueue.main.async {\n                        self?.tendiesFlashLog.append(line)\n                    }\n                }\n            )\n            tendiesFlashLog.append("✅ 主屏幕模糊状态已写入。")\n            if autoNeoSpringAfterFlash {\n                tendiesFlashLog.append("⚡ 自动 NeoSpring 已开启，正在重启桌面…")\n                DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) { [weak self] in\n                    self?.isNeoSpringing = true\n                    RespringHelper.triggerNeoSpring()\n                }\n            } else {\n                tendiesFlashLog.append("🧪 请手动 NeoSpring 后查看效果。")\n            }\n        } catch {\n            tendiesFlashLog.append("❌ 主屏幕模糊写入失败：\\(error.localizedDescription)")\n            errorMessage = "主屏幕模糊写入失败：\\(error.localizedDescription)"\n        }\n    }\n\n'
          VIEW_SECTION = '                // Fluidity: iOS18 Dynamic + Home Screen Blur\n                Section {\n                    Toggle(isOn: $vm.ios18FluidityDynamicEnabled) {\n                        VStack(alignment: .leading, spacing: 2) {\n                            Text("iOS 18 Fluidity 动态模式")\n                                .font(.subheadline.weight(.medium))\n                            Text(vm.ios18FluidityDynamicEnabled ? "刷入 MercuryPoster 时应用 dynamic 测试字段" : "保持原始/标准 MercuryPoster 字段")\n                                .font(.caption2)\n                                .foregroundColor(.secondary)\n                        }\n                    }\n\n                    Toggle(isOn: $vm.homeScreenBlurEnabled) {\n                        VStack(alignment: .leading, spacing: 2) {\n                            Text("主屏幕模糊")\n                                .font(.subheadline.weight(.medium))\n                            Text(vm.homeScreenBlurEnabled ? "开启 Blur" : "关闭 Blur")\n                                .font(.caption2)\n                                .foregroundColor(.secondary)\n                        }\n                    }\n\n                    Button {\n                        Task { await vm.applyHomeScreenBlurNow() }\n                    } label: {\n                        HStack {\n                            Spacer()\n                            if vm.isApplyingHomeScreenBlur {\n                                ProgressView()\n                            } else {\n                                Image(systemName: "drop.fill")\n                            }\n                            Text("立即应用主屏幕模糊状态")\n                            Spacer()\n                        }\n                    }\n                    .disabled(vm.isApplyingHomeScreenBlur)\n                } header: {\n                    Text("iOS 18 动态壁纸")\n                } footer: {\n                    Text("动态模式 ON：刷入 MercuryPoster 时写入 fluidity.dynamic / Automatic / dynamic；OFF：不套用测试字段。主屏幕模糊使用已实机验证的 459C311E… / versions/18 / supplement 5，两个开关互相独立。")\n                }\n                .tint(.blue)\n\n'

          engine = Path("ios-app/TendiesEngine.swift")
          if not engine.exists():
              raise SystemExit("TendiesEngine.swift not found")
          es = engine.read_text()
          if "setFluidityHomeScreenBlur" not in es:
              marker = "    // MARK: - Send Respring Signal via Tunnel\n"
              if marker not in es:
                  raise SystemExit("TendiesEngine insertion marker not found")
              es = es.replace(marker, ENGINE_METHOD + marker, 1)
              engine.write_text(es)

          vm = Path("ios-app/AppViewModel.swift")
          if not vm.exists():
              raise SystemExit("AppViewModel.swift not found")
          s = vm.read_text()
          state_anchor = '@Published var isNeoSpringing: Bool = false'
          if "ios18FluidityDynamicEnabled" not in s or "homeScreenBlurEnabled" not in s:
              if state_anchor not in s:
                  raise SystemExit("AppViewModel state anchor missing")
              s = s.replace(state_anchor, state_anchor + VM_STATE, 1)

          if "Synchronizing iOS18 wallpaper Home Screen Blur" not in s:
              anchor = '            tendiesFlashPhase = .done(ok: true)\n'
              if anchor not in s:
                  raise SystemExit("flashSelectedTendies success anchor missing")
              s = s.replace(anchor, VM_SYNC + anchor, 1)

          if "func applyHomeScreenBlurNow() async" not in s:
              anchor = '    func respringDevice() {\n'
              if anchor not in s:
                  raise SystemExit("respringDevice anchor missing")
              s = s.replace(anchor, VM_FUNC + anchor, 1)
          vm.write_text(s)

          view = Path("ios-app/TendiesView.swift")
          if not view.exists():
              raise SystemExit("TendiesView.swift not found")
          v = view.read_text()
          if "立即应用主屏幕模糊状态" not in v:
              marker = "                // Section 3: Wallpapers Gallery\n"
              if marker not in v:
                  raise SystemExit("Wallpapers Gallery marker not found")
              v = v.replace(marker, VIEW_SECTION + marker, 1)
              view.write_text(v)

          checks = {
              "TendiesEngine.swift": ["setFluidityHomeScreenBlur", CONFIG_UUID, "fluidityHomeBlurOnB64", "fluidityHomeBlurOffB64"],
              "AppViewModel.swift": ["ios18FluidityDynamicEnabled", "aircard.v10.ios18_fluidity_dynamic", "homeScreenBlurEnabled", "applyHomeScreenBlurNow", "Synchronizing iOS18 wallpaper Home Screen Blur"],
              "TendiesView.swift": ["iOS 18 Fluidity 动态模式", "立即应用主屏幕模糊状态", "iOS 18 动态壁纸", "主屏幕模糊"],
          }
          for file, needles in checks.items():
              body = Path("ios-app").joinpath(file).read_text()
              miss = [n for n in needles if n not in body]
              if miss:
                  raise SystemExit(f"Home Blur integration verification failed in {file}: {miss}")
          verify_engine = Path("ios-app/TendiesEngine.swift").read_text()
          verified_needles = [
              "459C311E-3615-4485-A24A-33A10CB3A3ED",
              "/versions/18/supplements/",
              'let supplementRevision = "5"',
              "fluidityHomeBlurOnB64",
              "fluidityHomeBlurOffB64",
          ]
          missing_verified = [x for x in verified_needles if x not in verify_engine]
          if missing_verified:
              raise SystemExit("Verified Home Blur path check failed: " + ", ".join(missing_verified))
          if "8A50B665-CEDE-436F-880B-9B2314B79105" in verify_engine or "/versions/0/supplements/" in verify_engine:
              raise SystemExit("Old Home Blur test path is still present; refusing to build")
          print("Verified target: 459C311E… / versions/18 / supplement 5")
          print("V10.4 verified iOS18 wallpaper Home Screen Blur control integrated")
          PY

      - name: Detect project and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$(find . -name '*.xcodeproj' -print -quit)"
          test -n "$PROJ"
          DIR="$(dirname "$PROJ")"
          NAME="$(basename "$PROJ")"
          SCHEME="$(cd "$DIR" && xcodebuild -project "$NAME" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"
          test -n "$SCHEME"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "project=$NAME" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build V10.4
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.xcode.outputs.dir }}"
          xcodebuild             -project "${{ steps.xcode.outputs.project }}"             -scheme "${{ steps.xcode.outputs.scheme }}"             -configuration Release             -sdk iphoneos             -derivedDataPath "$RUNNER_TEMP/AirCardV1040"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             MARKETING_VERSION=10.4             CURRENT_PROJECT_VERSION=1040             COMPILER_INDEX_STORE_ENABLE=NO             build

      - name: Verify and fast-package
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/AirCardV1040/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 10.4" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1040" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName AirCard-iOS" "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string AirCard-iOS" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName AirCard-iOS" "$APP/Info.plist" 2>/dev/null || true

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "Bundle ID: $ID"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          [ "$VERSION" = "10.4" ]
          [ "$BUILD" = "1040" ]

          rm -rf Payload release
          mkdir -p Payload release
          cp -R "$APP" Payload/
          zip -0qry "release/$IPA_NAME" Payload
          unzip -Z1 "release/$IPA_NAME" | grep -q '^Payload/.*\.app/'

          rm -rf "$RUNNER_TEMP/ipa-check"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "release/$IPA_NAME" -d "$RUNNER_TEMP/ipa-check"
          PACKED_APP="$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$PACKED_APP"
          test -f "$PACKED_APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PACKED_APP/Info.plist")" = "$ID"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PACKED_APP/Info.plist")" = "10.4"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PACKED_APP/Info.plist")" = "1040"

          shasum -a 256 "release/$IPA_NAME" > release/AirCard-V10.4-iOS18-Dynamic-HomeBlur-SHA256.txt
          ls -lh "release/$IPA_NAME"

      - name: Publish standalone V10.4 中文版 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v10.4-ios18-dynamic-homeblur"
          TITLE="AirCard Fluidity V10.4 中文版 · iOS18 Dynamic + Home Blur"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "release/$IPA_NAME" release/AirCard-V10.4-iOS18-Dynamic-HomeBlur-SHA256.txt --clobber
          else
            gh release create "$TAG" "release/$IPA_NAME" release/AirCard-V10.4-iOS18-Dynamic-HomeBlur-SHA256.txt --title "$TITLE" --notes "AirCard Fluidity V10.4 简体中文版：加入可切换的 iOS 18 Fluidity 动态测试模式 + 已实机验证的主屏幕模糊控制，并保留 V10.4 原有开关。"
          fi
