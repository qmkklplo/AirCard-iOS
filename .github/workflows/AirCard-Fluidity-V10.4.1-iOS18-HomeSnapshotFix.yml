name: AirCard Fluidity V10.4.1 iOS18 Home Snapshot Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/AirCard-Fluidity-V10.4.1-iOS18-HomeSnapshotFix.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      IPA_NAME: AirCard-iOS-Fluidity-V10.4.1-iOS18-HomeSnapshotFix-ZH.ipa
      BASE_WORKFLOW: .github/workflows/AirCard-Fluidity-V10.4-iOS18-Dynamic-HomeBlur.yml
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Reuse V10.4 base and verified Blur integration
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RB'
          require 'yaml'
          d = YAML.load_file(ENV.fetch('BASE_WORKFLOW'))
          steps = d.fetch('jobs').fetch('build').fetch('steps')
          wanted = [
            'Integrate V10 features',
            'Integrate verified iOS18 wallpaper Home Screen Blur control'
          ]
          wanted.each_with_index do |name, i|
            step = steps.find { |x| x['name'] == name } or abort("Missing base step: #{name}")
            File.write("/tmp/base-step-#{i}.sh", step.fetch('run'))
          end
          RB
          bash /tmp/base-step-0.sh
          bash /tmp/base-step-1.sh

          # The combined Blur step also injects the old experimental toggle/state.
          # The dynamic engine step is never executed; remove only that leftover UI/state.
          python3 <<'PY'
          from pathlib import Path
          import re

          vm = Path("ios-app/AppViewModel.swift")
          src = vm.read_text()
          src, n = re.subn(
              r'\n\s*@Published var ios18FluidityDynamicEnabled: Bool = UserDefaults\.standard\.object\(forKey: "aircard\.v10\.ios18_fluidity_dynamic"\).*?\n\s*}\n',
              '\n', src, count=1, flags=re.S
          )
          if n != 1:
              raise SystemExit("Could not remove dynamic-mode AppViewModel state")
          vm.write_text(src)

          view = Path("ios-app/TendiesView.swift")
          v = view.read_text()
          start = v.find('                    Toggle(isOn: $vm.ios18FluidityDynamicEnabled) {')
          if start >= 0:
              end = v.find('                    Toggle(isOn: $vm.homeScreenBlurEnabled) {', start)
              if end < 0:
                  raise SystemExit("Could not delimit dynamic toggle")
              v = v[:start] + v[end:]
          old_footer = '                    Text("动态模式 ON：刷入 MercuryPoster 时写入 fluidity.dynamic / Automatic / dynamic；OFF：不套用测试字段。主屏幕模糊使用已实机验证的 459C311E… / versions/18 / supplement 5，两个开关互相独立。")'
          new_footer = '                    Text("主屏幕模糊使用已实机验证的 459C311E… / versions/18 / supplement 5。刷入壁纸时会自动同步这里选择的 Blur 状态。")'
          v = v.replace(old_footer, new_footer)
          v = v.replace('// Fluidity: iOS18 Dynamic + Home Screen Blur', '// Fluidity: iOS18 Home Screen Blur')
          view.write_text(v)
          PY

          ! grep -R -n -E 'fluidity\.dynamic|aircard\.v10\.ios18_fluidity_dynamic|applyIOS18FluidityDynamicMode|iOS 18 Fluidity 动态模式' ios-app

      - name: Integrate Home Snapshot regeneration fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('ios-app/TendiesEngine.swift')
          s = p.read_text()

          helper = r'''
              // MARK: - iOS18 Celosia Home Snapshot Regeneration Fix
              private func prepareIOS18CelosiaHomeSnapshotRegeneration(
                  in mercuryContainerRoot: URL,
                  log: @escaping (String) -> Void
              ) {
                  let fm = FileManager.default
                  let root = mercuryContainerRoot
                      .appendingPathComponent("descriptors")
                      .appendingPathComponent("459C311E-3615-4485-A24A-33A10CB3A3ED")
                      .appendingPathComponent("versions")
                      .appendingPathComponent("1")
                  guard let files = try? fm.contentsOfDirectory(
                      at: root,
                      includingPropertiesForKeys: [.isRegularFileKey],
                      options: [.skipsHiddenFiles]
                  ) else {
                      log("  💤 Home Snapshot fix skipped — 459C…/versions/1 not found")
                      return
                  }

                  var removedATX = 0
                  var removedStats = 0
                  var invalidatedMetadata = 0

                  for url in files {
                      let name = url.lastPathComponent
                      if name.hasPrefix("RuntimeSnapshot-") && name.hasSuffix("-home.atx") {
                          do { try fm.removeItem(at: url); removedATX += 1 }
                          catch { log("  ⚠️ Could not remove staged Home ATX: \(error.localizedDescription)") }
                          continue
                      }
                      if name.hasPrefix("RuntimeSnapshotColorStatisticsMetadata-") && name.hasSuffix("-home.plist") {
                          do { try fm.removeItem(at: url); removedStats += 1 }
                          catch { log("  ⚠️ Could not remove staged Home color stats: \(error.localizedDescription)") }
                          continue
                      }
                      guard name.hasPrefix("RuntimeSnapshotMetadata-") && name.hasSuffix("-home.plist"),
                            let data = try? Data(contentsOf: url),
                            var plist = (try? PropertyListSerialization.propertyList(
                                from: data, options: .mutableContainers, format: nil
                            )) as? [String: Any] else { continue }

                      plist["PUIPosterSnapshotBundleInfoKeyBootSessionIdentifier"] = UUID().uuidString
                      plist["PUIPosterSnapshotBundleInfoKeySnapshotBundleUUID"] = UUID().uuidString
                      plist["PUIPosterSnapshotBundleInfoKeyDateCreated"] = Date(timeIntervalSince1970: 0)
                      plist["PUIPosterSnapshotBundleInfoKeySnapshotEpoch"] = 0
                      plist["PUIPosterSnapshotBundleInfoKeyContainsColorStatistics"] = false
                      plist["PUIPosterSnapshotBundleInfoKeyHasColorStatistics"] = false
                      do {
                          let out = try PropertyListSerialization.data(
                              fromPropertyList: plist, format: .binary, options: 0
                          )
                          try out.write(to: url, options: .atomic)
                          invalidatedMetadata += 1
                      } catch {
                          log("  ⚠️ Home metadata invalidation failed: \(error.localizedDescription)")
                      }
                  }
                  log("  🧹 Home Snapshot fix: HomeATX=\(removedATX), stats=\(removedStats), metadata=\(invalidatedMetadata)")
                  if invalidatedMetadata > 0 {
                      log("  ✅ Stale Home snapshot identity invalidated; Lock snapshot untouched")
                  }
              }

          '''

          marker = '    // MARK: - Plist Identifier Handling\n'
          if marker not in s:
              marker = '    // MARK: - Folder Injector Helper (Single Atomic Move via AirTraffic)\n'
          if marker not in s:
              raise SystemExit('TendiesEngine helper insertion marker not found')
          if 'prepareIOS18CelosiaHomeSnapshotRegeneration' not in s:
              s = s.replace(marker, helper + marker, 1)

          anchor = '                log("  📦 V8 Container Tendie detected — preserving original paths and identifiers")\n'
          call = '''                let mercuryRootForSnapshotFix = containerStage.appendingPathComponent(
                    "Library/Application Support/PRBPosterExtensionDataStore/61/Extensions/com.apple.MercuryPoster"
                )
                if FileManager.default.fileExists(atPath: mercuryRootForSnapshotFix.path) {
                    log("  🧭 Applying iOS18 Home Snapshot regeneration fix")
                    prepareIOS18CelosiaHomeSnapshotRegeneration(in: mercuryRootForSnapshotFix, log: log)
                }

          '''
          if 'Applying iOS18 Home Snapshot regeneration fix' not in s:
              if anchor not in s:
                  raise SystemExit('V8 passthrough anchor not found')
              s = s.replace(anchor, call + anchor, 1)
          p.write_text(s)

          required = [
              'prepareIOS18CelosiaHomeSnapshotRegeneration',
              'PUIPosterSnapshotBundleInfoKeyBootSessionIdentifier',
              '459C311E-3615-4485-A24A-33A10CB3A3ED',
              'setFluidityHomeScreenBlur',
              '/versions/18/supplements/',
              'let supplementRevision = "5"',
          ]
          body = p.read_text()
          missing = [x for x in required if x not in body]
          if missing: raise SystemExit('Missing integration: ' + ', '.join(missing))
          forbidden = ['fluidity.dynamic','aircard.v10.ios18_fluidity_dynamic','applyIOS18FluidityDynamicMode','iOS 18 Fluidity 动态模式']
          bad = [x for x in forbidden if x in body]
          if bad: raise SystemExit('Obsolete dynamic mode remains: ' + ', '.join(bad))
          print('Home Snapshot regeneration fix integrated; dynamic-mode experiment absent')
          PY

      - name: Detect project and build IPA
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$(find . -name '*.xcodeproj' -print -quit)"
          test -n "$PROJ"
          DIR="$(dirname "$PROJ")"; NAME="$(basename "$PROJ")"
          SCHEME="$(cd "$DIR" && xcodebuild -project "$NAME" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"
          test -n "$SCHEME"
          cd "$DIR"
          xcodebuild -project "$NAME" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AirCardV1041" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=10.4.1 CURRENT_PROJECT_VERSION=1041 COMPILER_INDEX_STORE_ENABLE=NO build

          APP="$(find "$RUNNER_TEMP/AirCardV1041/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 10.4.1' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1041' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName AirCard-iOS' "$APP/Info.plist" 2>/dev/null || true

          cd "$GITHUB_WORKSPACE"
          rm -rf Payload release && mkdir -p Payload release
          cp -R "$APP" Payload/
          zip -0qry "release/$IPA_NAME" Payload
          unzip -Z1 "release/$IPA_NAME" | grep -q '^Payload/.*\.app/'
          shasum -a 256 "release/$IPA_NAME" | tee release/AirCard-V10.4.1-iOS18-HomeSnapshotFix-SHA256.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-Fluidity-V10.4.1-iOS18-HomeSnapshotFix-IPA
          path: release/*
          retention-days: 14

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v10.4.1-ios18-homesnapshotfix"
          TITLE="AirCard Fluidity V10.4.1 · iOS18 Home Snapshot Fix"
          NOTES="移除无效的动态模式实验；保留已验证的主屏幕模糊控制；加入 Home RuntimeSnapshot 失效/再生成修复候选，用于测试 iOS18 Celosia 在 iOS27 开启桌面模糊后不随 timeOfDay 更新的问题。Auto NeoSpring 默认关闭。"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG" release/* --title "$TITLE" --notes "$NOTES" --repo "$GH_REPO"
          fi
