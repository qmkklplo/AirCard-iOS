name: Build AirCard Version Test 8.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Change version to 8.1 build 810
        shell: bash
        run: |
          set -e
          PBX="$(find . -name project.pbxproj -print -quit)"
          if [ -z "$PBX" ]; then
            echo "::error::project.pbxproj not found"
            exit 1
          fi

          python3 - "$PBX" <<'PY'
          import re, sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()
          s, n1 = re.subn(r'MARKETING_VERSION\s*=\s*[^;]+;',
                           'MARKETING_VERSION = 8.1;', s)
          s, n2 = re.subn(r'CURRENT_PROJECT_VERSION\s*=\s*[^;]+;',
                           'CURRENT_PROJECT_VERSION = 810;', s)
          if not n1 or not n2:
              raise SystemExit("Version fields were not found")
          p.write_text(s)
          print(f"Updated {p}: MARKETING_VERSION={n1}, CURRENT_PROJECT_VERSION={n2}")
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust core
        shell: bash
        run: |
          set -e
          if [ -f "rust-core/Cargo.toml" ]; then
            cd rust-core
            cargo build --release --target aarch64-apple-ios
          else
            echo "No rust-core/Cargo.toml at repository root; continuing."
          fi

      - name: Detect Xcode project and scheme
        id: xcode
        shell: bash
        run: |
          set -e
          PROJ="$(find . -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJ" ]; then
            echo "::error::No Xcode project found"
            exit 1
          fi

          DIR="$(dirname "$PROJ")"
          NAME="$(basename "$PROJ")"
          SCHEME="$(cd "$DIR" && xcodebuild -project "$NAME" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"

          if [ -z "$SCHEME" ]; then
            echo "::error::No Xcode scheme detected"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "project=$NAME" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned app
        shell: bash
        run: |
          set -e
          cd "${{ steps.xcode.outputs.dir }}"

          xcodebuild \
            -project "${{ steps.xcode.outputs.project }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AirCardBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=8.1 \
            CURRENT_PROJECT_VERSION=810 \
            build

      - name: Verify built version
        shell: bash
        run: |
          set -e
          APP="$(find "$RUNNER_TEMP/AirCardBuild/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"

          echo "Built app: $APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")

          [ "$VERSION" = "8.1" ] || { echo "::error::Expected version 8.1, got $VERSION"; exit 1; }
          [ "$BUILD" = "810" ] || { echo "::error::Expected build 810, got $BUILD"; exit 1; }

      - name: Package IPA
        shell: bash
        run: |
          set -e
          APP="$(find "$RUNNER_TEMP/AirCardBuild/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          rm -rf Payload release
          mkdir -p Payload release
          cp -R "$APP" Payload/
          zip -qry "release/AirCard-VersionTest-8.1-build810.ipa" Payload
          ls -lh release/

      - name: Publish to latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AirCard Version Test 8.1
          prerelease: true
          make_latest: true
          body: |
            Overwrite-installation test build.
            Version: 8.1
            Build: 810
            Bundle ID and app functionality are unchanged.
          files: release/AirCard-VersionTest-8.1-build810.ipa
          fail_on_unmatched_files: true
