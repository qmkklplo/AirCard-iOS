name: Build AirCard Mercury Test v5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Mercury v5
        run: |
          grep -n "preservesMercuryDescriptorUUID" ios-app/TendiesEngine.swift
          grep -n "sourceDescriptorUUID" ios-app/TendiesEngine.swift
          grep -n "Mercury V5: preserving source descriptor UUID" ios-app/TendiesEngine.swift
          grep -n "preserveSemanticIdentifiers" ios-app/TendiesEngine.swift
          grep -n "com.apple.MercuryPoster" ios-app/TendiesEngine.swift

      - name: Build IPA
        run: |
          chmod +x build-ipa.sh
          ./build-ipa.sh
          test -f build/AirCard-iOS.ipa
          cp build/AirCard-iOS.ipa build/AirCard-Mercury-Test-v5.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-Mercury-Test-v5
          path: build/AirCard-Mercury-Test-v5.ipa

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mercury-test-v5 --cleanup-tag -y 2>/dev/null || true
          gh release create mercury-test-v5 build/AirCard-Mercury-Test-v5.ipa --target "${{ github.sha }}" --title "AirCard Mercury Test v5" --notes "Mercury Test v5 - preserves Mercury semantic identifiers and the source descriptor folder UUID."
