name: Build AirCard Version Test 8.1 Verified

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force version 8.1 build 810
        shell: bash
        run: |
          set -euo pipefail
          PBX="$(find . -name project.pbxproj -print -quit)"
          test -n "$PBX" || { echo "::error::project.pbxproj not found"; exit 1; }

          python3 - "$PBX" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s, a = re.subn(r'MARKETING_VERSION\s*=\s*[^;]+;', 'MARKETING_VERSION = 8.1;', s)
          s, b = re.subn(r'CURRENT_PROJECT_VERSION\s*=\s*[^;]+;', 'CURRENT_PROJECT_VERSION = 810;', s)
          if not a or not b:
              raise SystemExit("Could not find Xcode version fields")
          p.write_text(s)
          print(f"Updated {p}: version entries={a}, build entries={b}")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust core if required
        shell: bash
        run: |
          set -euo pipefail
          if [ -f rust-core/Cargo.toml ]; then
            cd rust-core
            if [ -f build.sh ]; then
              chmod +x build.sh
              ./build.sh
            elif [ -f build_ios.sh ]; then
              chmod +x build_ios.sh
              ./build_ios.sh
            else
              cargo build --release --target aarch64-apple-ios
            fi
          else
            echo "No root rust-core/Cargo.toml; continuing."
          fi

      - name: Detect Xcode project and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$(find . -name '*.xcodeproj' -print -quit)"
          test -n "$PROJ" || { echo "::error::No Xcode project found"; exit 1; }

          DIR="$(dirname "$PROJ")"
          NAME="$(basename "$PROJ")"
          SCHEME="$(cd "$DIR" && xcodebuild -project "$NAME" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"
          test -n "$SCHEME" || { echo "::error::No Xcode scheme found"; exit 1; }

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "project=$NAME" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJ"
          echo "Scheme: $SCHEME"

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/AirCardBuild"
          cd "${{ steps.xcode.outputs.dir }}"

          xcodebuild \
            -project "${{ steps.xcode.outputs.project }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AirCardBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=8.1 \
            CURRENT_PROJECT_VERSION=810 \
            build

      - name: Verify app metadata
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/AirCardBuild/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP" || { echo "::error::Built .app not found"; exit 1; }

          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")

          echo "Bundle ID: $ID"
          echo "Version: $VERSION"
          echo "Build: $BUILD"

          [ "$VERSION" = "8.1" ] || { echo "::error::Expected version 8.1, got $VERSION"; exit 1; }
          [ "$BUILD" = "810" ] || { echo "::error::Expected build 810, got $BUILD"; exit 1; }

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/AirCardBuild/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          rm -rf Payload release
          mkdir -p Payload release
          ditto "$APP" "Payload/$(basename "$APP")"

          # ditto creates a standard ZIP while preserving the app bundle correctly.
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload \
            "release/AirCard-VersionTest-8.1-build810-VERIFIED.ipa"

      - name: Validate IPA ZIP structure
        shell: bash
        run: |
          set -euo pipefail
          IPA="release/AirCard-VersionTest-8.1-build810-VERIFIED.ipa"

          echo "=== File information ==="
          ls -lh "$IPA"
          file "$IPA"

          echo "=== ZIP integrity test ==="
          unzip -t "$IPA"

          echo "=== Payload check ==="
          unzip -l "$IPA" | head -80
          unzip -l "$IPA" | grep -q 'Payload/.*\.app/' || {
            echo "::error::IPA does not contain Payload/*.app/"
            exit 1
          }

          SIZE=$(stat -f%z "$IPA")
          echo "Exact IPA size: $SIZE bytes"
          [ "$SIZE" -gt 1000000 ] || {
            echo "::error::IPA is unexpectedly small"
            exit 1
          }

          echo "=== SHA-256 ==="
          shasum -a 256 "$IPA" | tee release/SHA256.txt

      - name: Remove old test asset from latest Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the fixed 'latest' release but remove any asset with this exact
          # verified-test filename before uploading the new one.
          gh release delete-asset latest \
            "AirCard-VersionTest-8.1-build810-VERIFIED.ipa" \
            --yes 2>/dev/null || true
          gh release delete-asset latest "SHA256.txt" --yes 2>/dev/null || true

      - name: Publish verified IPA to latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AirCard Version Test 8.1
          prerelease: true
          make_latest: true
          body: |
            Verified overwrite-installation test.
            Version: 8.1
            Build: 810

            GitHub Actions validates the IPA with `unzip -t` before publishing.
            SHA256.txt is generated from the exact published IPA.
          files: |
            release/AirCard-VersionTest-8.1-build810-VERIFIED.ipa
            release/SHA256.txt
          fail_on_unmatched_files: true
